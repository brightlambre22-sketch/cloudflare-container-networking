name: Worker headless v86 spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/headless-v86-spike.yml"
  push:
    branches: [experiment/worker-headless-v86]
    paths:
      - "cloudflare/**"
      - ".github/workflows/headless-v86-spike.yml"

jobs:
  loader-tests-and-worker-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Test Worker asset loader
        run: npm run test:headless
      - name: Build upstream v86 candidate bundle
        run: npm run build:headless-v86
      - name: Upload candidate bundle for inspection
        uses: actions/upload-artifact@v4
        with:
          name: headless-v86-candidate-bundle
          path: cloudflare/dist/headless-v86-bundle.js
          if-no-files-found: error
          retention-days: 7
      - name: Bundle Worker without deploying
        run: npm run check
      - name: Smoke-test v86 module inside local Workerd
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --config wrangler.headless-v86-smoke.toml --ip 127.0.0.1 --port 8788 > /tmp/headless-v86-workerd.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:8788/ > /tmp/headless-v86-workerd.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/headless-v86-workerd.log
            exit 1
          fi
          cat /tmp/headless-v86-workerd.json
          node --input-type=module -e 'import fs from "node:fs"; const r = JSON.parse(fs.readFileSync("/tmp/headless-v86-workerd.json", "utf8")); if (r.probe !== "headless-v86-workerd-import" || r.module_loaded !== true || r.runtime !== "workerd") process.exit(1);'
