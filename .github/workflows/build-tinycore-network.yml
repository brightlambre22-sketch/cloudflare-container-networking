name: Build Tiny Core Pure64 network-enabled image
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y xorriso cpio kmod libarchive-tools

      - name: Download Tiny Core 11.0 files
        run: |
          set -euxo pipefail
          mkdir -p work/iso work/pure public/boot
          curl -fL --retry 5 --retry-all-errors -o work/base.iso https://distro.ibiblio.org/tinycorelinux/11.x/x86/archive/11.0/TinyCore-11.0.iso
          curl -fL --retry 5 --retry-all-errors -o work/pure/vmlinuz64 https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.0/distribution_files/vmlinuz64
          curl -fL --retry 5 --retry-all-errors -o work/pure/corepure64.gz https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.0/distribution_files/corepure64.gz
          curl -fL --retry 5 --retry-all-errors -o work/pure/modules64.gz https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.0/distribution_files/modules64.gz
          test $(stat -c%s work/base.iso) -gt 1000000
          test $(stat -c%s work/pure/vmlinuz64) -gt 1000000
          test $(stat -c%s work/pure/corepure64.gz) -gt 1000000
          test $(stat -c%s work/pure/modules64.gz) -gt 1000000
          bsdtar -xf work/base.iso -C work/iso
          test -s work/iso/boot/isolinux/isolinux.bin

      - name: Build network-enabled initrd and ISO
        run: |
          set -euxo pipefail
          rm -rf work/root work/repacked verify
          mkdir -p work/root/usr/local/bin work/repacked/boot verify
          gzip -dc work/pure/corepure64.gz | (cd work/root && cpio -idmu)
          gzip -dc work/pure/modules64.gz | (cd work/root && cpio -idmu)

          # Tiny Core's base BusyBox supplies the DHCP and legacy network
          # commands. Make the expected paths explicit so boot does not depend
          # on whichever BusyBox symlinks happened to be in the source image.
          test -x work/root/bin/busybox
          for applet in udhcpc ifconfig route; do
            work/root/bin/busybox --list | grep -Fx "$applet"
            mkdir -p work/root/sbin
            ln -sf /bin/busybox "work/root/sbin/$applet"
          done

          # modprobe must be available before the NE2000 driver can be loaded.
          if work/root/bin/busybox --list | grep -Fxq modprobe; then
            ln -sf /bin/busybox work/root/sbin/modprobe
          fi
          test -x work/root/sbin/modprobe || test -x work/root/usr/sbin/modprobe

          install -m 0755 runner/tinycore/init-network.sh work/root/usr/local/bin/init-network.sh
          test -x work/root/usr/local/bin/init-network.sh

          # The 11.0 modules archive must contain the PCI NE2000 driver and its
          # 8390 dependency. Fail the build instead of producing an ISO that
          # boots but cannot create eth0.
          test -d work/root/usr/local/lib/modules/5.4.3-tinycore64
          find work/root/usr/local/lib/modules/5.4.3-tinycore64 -type f -name '8390.ko*' | grep -q .
          find work/root/usr/local/lib/modules/5.4.3-tinycore64 -type f -name 'ne2k-pci.ko*' | grep -q .

          depmod -b work/root 5.4.3-tinycore64
          test -s work/root/usr/local/lib/modules/5.4.3-tinycore64/modules.dep

          echo "=== embedded network files ==="
          ls -l work/root/bin/busybox work/root/sbin/udhcpc work/root/sbin/ifconfig work/root/sbin/route
          find work/root/usr/local/lib/modules/5.4.3-tinycore64 -type f \( -name '8390.ko*' -o -name 'ne2k-pci.ko*' \) -print
          echo "=== embedded network commands ==="
          work/root/bin/busybox --list | grep -E '^(udhcpc|ifconfig|route|modprobe)$' | sort

          (cd work/root && find . -print0 | cpio --null -o -H newc | gzip -2) > work/repacked/boot/corepure64.gz
          cp work/pure/vmlinuz64 work/repacked/boot/vmlinuz64
          cp -a work/iso/boot/isolinux work/repacked/boot/
          cat > work/repacked/boot/isolinux/isolinux.cfg <<'EOF'
DEFAULT tinycore
PROMPT 0
TIMEOUT 1
LABEL tinycore
  KERNEL /boot/vmlinuz64
  APPEND initrd=/boot/corepure64.gz waitusb=1 noswap nozswap
EOF
          xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid TINYCORE11NET -eltorito-boot boot/isolinux/isolinux.bin -boot-load-size 4 -eltorito-catalog boot/isolinux/boot.cat -boot-info-table -no-emul-boot -output public/boot/TinyCore_Pure64-11.0.iso work/repacked
          test $(stat -c%s public/boot/TinyCore_Pure64-11.0.iso) -gt 1000000
          sha256sum public/boot/TinyCore_Pure64-11.0.iso > public/boot/TinyCore_Pure64-11.0.iso.sha256

          # Verify the rebuilt ISO contains the complete network payload.
          bsdtar -xf public/boot/TinyCore_Pure64-11.0.iso -C verify
          gzip -dc verify/boot/corepure64.gz | cpio -it 2>/dev/null | grep -Fx usr/local/bin/init-network.sh
          gzip -dc verify/boot/corepure64.gz | cpio -it 2>/dev/null | grep -Fx bin/busybox
          gzip -dc verify/boot/corepure64.gz | cpio -it 2>/dev/null | grep -Fx sbin/udhcpc
          gzip -dc verify/boot/corepure64.gz | cpio -it 2>/dev/null | grep -Fx sbin/ifconfig
          gzip -dc verify/boot/corepure64.gz | cpio -it 2>/dev/null | grep -Fx sbin/route
          gzip -dc verify/boot/corepure64.gz | cpio -it 2>/dev/null | grep -E 'usr/local/lib/modules/5.4.3-tinycore64/.*/(8390|ne2k-pci)\.ko' | head -1

      - name: Commit generated image
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/boot/TinyCore_Pure64-11.0.iso public/boot/TinyCore_Pure64-11.0.iso.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Build Pure64 11.0 with network bootstrap"
          git push
