name: Build Tiny Core Pure64 network-enabled image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tinycore-network.yml"
      - "runner/tinycore/init-network.sh"
      - "public/vm.html"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools cpio kmod libarchive-tools
      - name: Download official Tiny Core Pure64 11.0
        run: |
          set -euo pipefail
          mkdir -p work public/boot
          curl -fL --retry 5 -o work/CorePure64-11.0.iso https://distro.ibiblio.org/tinycorelinux/11.x/x86_64/release/CorePure64-11.0.iso
          curl -fL --retry 5 -o work/CorePure64-11.0.iso.md5.txt https://distro.ibiblio.org/tinycorelinux/11.x/x86_64/release/CorePure64-11.0.iso.md5.txt || true
          test "$(stat -c%s work/CorePure64-11.0.iso)" -gt 1000000
          file work/CorePure64-11.0.iso
      - name: Extract ISO
        run: |
          set -euo pipefail
          mkdir -p work/iso
          bsdtar -xf work/CorePure64-11.0.iso -C work/iso
          test -s work/iso/boot/vmlinuz64
          test -s work/iso/boot/corepure64.gz
          cp work/iso/boot/vmlinuz64 work/vmlinuz64
          cp work/iso/boot/corepure64.gz work/corepure64.gz
      - name: Fetch original Tiny Core kernel modules
        shell: bash
        run: |
          set -euo pipefail
          base=https://test.ftp.kaist.ac.kr/tc/11.x/x86_64/tcz
          mkdir -p work/tcz work/root
          fetch_deps() {
            local name="$1"
            [ -f "work/tcz/$name.tcz" ] || curl -fL --retry 5 -o "work/tcz/$name.tcz" "$base/$name.tcz"
            if [ -f "work/tcz/$name.tcz.dep" ]; then :; else curl -fL --retry 5 -o "work/tcz/$name.tcz.dep" "$base/$name.tcz.dep" || true; fi
            [ -f "work/tcz/$name.tcz.dep" ] || return 0
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              fetch_deps "$dep"
            done < <(sed '/^[[:space:]]*$/d' "work/tcz/$name.tcz.dep")
          }
          fetch_deps original-modules-5.4.3-tinycore64
          find work/tcz -name '*.tcz' -print
      - name: Build network-enabled initrd
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/root
          mkdir -p work/root
          gzip -dc work/corepure64.gz | (cd work/root && cpio -idmu --quiet)
          for pkg in work/tcz/*.tcz; do unsquashfs -f -q -d work/root "$pkg"; done
          mkdir -p work/root/usr/local/bin
          install -m 0755 runner/tinycore/init-network.sh work/root/usr/local/bin/init-network.sh
          depmod -b work/root 5.4.3-tinycore64
          mkdir -p work/repacked/boot
          (cd work/root && find . -print0 | cpio --null -o -H newc --quiet | gzip -2) > work/repacked/boot/corepure64.gz
          cp work/vmlinuz64 work/repacked/boot/vmlinuz64
          cp -a work/iso/boot/isolinux work/repacked/boot/
          xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid TINYCORE11NET \
            -eltorito-boot boot/isolinux/isolinux.bin -boot-load-size 4 \
            -eltorito-catalog boot/isolinux/boot.cat -boot-info-table \
            -no-emul-boot -output public/boot/TinyCore_Pure64-11.0.iso work/repacked
          test "$(stat -c%s public/boot/TinyCore_Pure64-11.0.iso)" -gt 1000000
          sha256sum public/boot/TinyCore_Pure64-11.0.iso > public/boot/TinyCore_Pure64-11.0.iso.sha256
          sha256sum public/boot/TinyCore_Pure64-11.0.iso
          ls -lh public/boot/TinyCore_Pure64-11.0.iso
      - name: Commit image and network bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/tinycore/init-network.sh public/boot/TinyCore_Pure64-11.0.iso public/boot/TinyCore_Pure64-11.0.iso.sha256
          git commit -m "Build Pure64 11.0 with original network modules" || exit 0
          git push
