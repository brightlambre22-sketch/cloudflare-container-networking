name: Build Tiny Core Pure64 network-enabled image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-tinycore-network.yml"
      - "runner/tinycore/init-network.sh"
      - "public/vm.html"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools cpio kmod libarchive-tools
      - name: Download Tiny Core bootloader and official Pure64 11.0 files
        run: |
          set -euo pipefail
          mkdir -p work/iso work/pure public/boot
          curl -fL --retry 5 -o work/base.iso https://distro.ibiblio.org/tinycorelinux/11.x/x86/archive/11.0/TinyCore-11.0.iso
          curl -fL --retry 5 -o work/pure/vmlinuz64 https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.0/distribution_files/vmlinuz64
          curl -fL --retry 5 -o work/pure/corepure64.gz https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.0/distribution_files/corepure64.gz
          curl -fL --retry 5 -o work/pure/modules64.gz https://mirror.math.princeton.edu/pub/tinycorelinux/11.x/x86_64/archive/11.0/distribution_files/modules64.gz
          test "$(stat -c%s work/base.iso)" -gt 1000000
          test "$(stat -c%s work/pure/vmlinuz64)" -gt 1000000
          test "$(stat -c%s work/pure/corepure64.gz)" -gt 1000000
          test "$(stat -c%s work/pure/modules64.gz)" -gt 1000000
          bsdtar -xf work/base.iso -C work/iso
          test -s work/iso/boot/isolinux/isolinux.bin
          cp work/pure/vmlinuz64 work/vmlinuz64
          cp work/pure/corepure64.gz work/corepure64.gz
          cp work/pure/modules64.gz work/modules64.gz
      - name: Prepare official kernel modules
        run: |
          set -euo pipefail
          test -s work/modules64.gz
          gzip -t work/modules64.gz

      - name: Build network-enabled initrd
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/root
          mkdir -p work/root
          gzip -dc work/corepure64.gz | (cd work/root && cpio -idmu --quiet)
          gzip -dc work/modules64.gz | (cd work/root && cpio -idmu --quiet)
          mkdir -p work/root/usr/local/bin
          install -m 0755 runner/tinycore/init-network.sh work/root/usr/local/bin/init-network.sh
          depmod -b work/root 5.4.3-tinycore64
          mkdir -p work/repacked/boot
          (cd work/root && find . -print0 | cpio --null -o -H newc --quiet | gzip -2) > work/repacked/boot/corepure64.gz
          cp work/vmlinuz64 work/repacked/boot/vmlinuz64
          cp -a work/iso/boot/isolinux work/repacked/boot/
          cat > work/repacked/boot/isolinux/isolinux.cfg <<'EOF'
DEFAULT tinycore
PROMPT 0
TIMEOUT 1
LABEL tinycore
  KERNEL /boot/vmlinuz64
  APPEND initrd=/boot/corepure64.gz waitusb=5 noswap nozswap
EOF
          xorriso -as mkisofs -iso-level 3 -full-iso9660-filenames -volid TINYCORE11NET \
            -eltorito-boot boot/isolinux/isolinux.bin -boot-load-size 4 \
            -eltorito-catalog boot/isolinux/boot.cat -boot-info-table \
            -no-emul-boot -output public/boot/TinyCore_Pure64-11.0.iso work/repacked
          test "$(stat -c%s public/boot/TinyCore_Pure64-11.0.iso)" -gt 1000000
          sha256sum public/boot/TinyCore_Pure64-11.0.iso > public/boot/TinyCore_Pure64-11.0.iso.sha256
          sha256sum public/boot/TinyCore_Pure64-11.0.iso
          ls -lh public/boot/TinyCore_Pure64-11.0.iso
      - name: Commit image and network bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner/tinycore/init-network.sh public/boot/TinyCore_Pure64-11.0.iso public/boot/TinyCore_Pure64-11.0.iso.sha256
          git commit -m "Build Pure64 11.0 with original network modules" || exit 0
          git push
