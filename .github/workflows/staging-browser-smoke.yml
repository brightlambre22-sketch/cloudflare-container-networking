name: Staging browser smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "public/**"
      - "tests/staging-browser-smoke.mjs"
      - ".github/workflows/staging-browser-smoke.yml"

jobs:
  staging-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test isolated staging preview
        env:
          STAGING_URL: https://vampirequid-staging-cloudflare-container-networking.brightlambre22-6dd.workers.dev
        run: node tests/staging-browser-smoke.mjs
