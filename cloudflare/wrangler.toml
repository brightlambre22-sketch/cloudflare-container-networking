name = "cloudflare-container-networking"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = true

[[containers]]
name = "node-runtime-durable"
class_name = "DurableNodeRuntime"
scheduling_policy = "durable_object"

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[[durable_objects.bindings]]
name = "DURABLE_NODE_RUNTIME"
class_name = "DurableNodeRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TunnelHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NodeRegistry"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["NodeRuntime"]
