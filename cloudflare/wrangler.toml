name = "cloudflare-container-networking"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = true

[assets]
directory = "../public"
binding = "ASSETS"

[[r2_buckets]]
binding = "VM_SNAPSHOTS"
bucket_name = "cloudflare-container-vm-snapshots"

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[exports.TunnelHub]
type = "durable-object"
storage = "sqlite"

[exports.NodeRegistry]
type = "durable-object"
storage = "sqlite"

[exports.NodeRuntime]
type = "durable-object"
storage = "sqlite"

[[queues.producers]]
binding = "REGISTRATION_QUEUE"
queue = "merchant-registration"

[[queues.consumers]]
queue = "merchant-registration"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

[exports.RegistrationRegistry]
type = "durable-object"
storage = "sqlite"
