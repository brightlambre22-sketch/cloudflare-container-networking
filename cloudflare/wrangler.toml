name = "cloudflare-container-networking"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = true

[assets]
directory = "../public"
binding = "ASSETS"

[[r2_buckets]]
binding = "VM_SNAPSHOTS"
bucket_name = "cloudflare-container-vm-snapshots"

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[[durable_objects.bindings]]
name = "VM_EXECUTION"
class_name = "VmExecution"

[[durable_objects.bindings]]
name = "ACCOUNT_REGISTRY"
class_name = "AccountRegistry"

[exports.TunnelHub]
type = "durable-object"
storage = "sqlite"

[exports.NodeRegistry]
type = "durable-object"
storage = "sqlite"

[exports.NodeRuntime]
type = "durable-object"
storage = "sqlite"

[exports.VmExecution]
type = "durable-object"
storage = "sqlite"

[vars]
VM_BASELINE_ID = "v2"

[vars]
VM_BASELINE_ID = "admin"

[exports.AccountRegistry]
type = "durable-object"
storage = "sqlite"
