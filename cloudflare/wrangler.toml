name = "cloudflare-container-networking"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = true

# Do not set an explicit CPU limit here: Cloudflare rejects configured CPU limits
# on the Free plan (API error 100328). Keep the account's plan-supported default.
# Generate the v86 bundle and compiled WASM before Wrangler resolves Worker imports.
# Required when deploying directly with `wrangler deploy` from Cloudflare's build environment.
[build]
command = "npm install --no-audit --no-fund && npm run build:headless-v86"

[[rules]]
type = "CompiledWasm"
globs = ["src/generated/v86.wasm"]
fallthrough = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/studio", "/studio/", "/studio.html", "/workspace", "/workspace/", "/workspace.html", "/merchant-orders", "/merchant-orders/", "/merchant-orders.html", "/merchant-location", "/merchant-location/", "/merchant-location.html"]

[[r2_buckets]]
binding = "VM_SNAPSHOTS"
bucket_name = "cloudflare-container-vm-snapshots"

[[r2_buckets]]
binding = "PROJECT_STORAGE"
bucket_name = "vampiresquid-project-storage"

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[[durable_objects.bindings]]
name = "VM_EXECUTION"
class_name = "VmExecution"

[[durable_objects.bindings]]
name = "ACCOUNT_REGISTRY"
class_name = "AccountRegistry"

[exports.TunnelHub]
type = "durable-object"
storage = "sqlite"

[exports.NodeRegistry]
type = "durable-object"
storage = "sqlite"

[exports.NodeRuntime]
type = "durable-object"
storage = "sqlite"

[exports.VmExecution]
type = "durable-object"
storage = "sqlite"

[vars]
VM_BASELINE_ID = "admin"
ORACLE_ACCOUNT_EXEC_ENABLED = "true"
DOORDASH_ENVIRONMENT = "sandbox"

[exports.AccountRegistry]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "ACCOUNT_PROVISIONER"
class_name = "AccountProvisioner"

[[durable_objects.bindings]]
name = "BUSINESS_DATABASE"
class_name = "BusinessDatabase"

[[durable_objects.bindings]]
name = "INVENTORY_LEDGER"
class_name = "InventoryLedger"

[[durable_objects.bindings]]
name = "WISP_RELAY"
class_name = "WispRelay"

[exports.AccountProvisioner]
type = "durable-object"
storage = "sqlite"

[exports.BusinessDatabase]
type = "durable-object"
storage = "sqlite"

[exports.InventoryLedger]
type = "durable-object"
storage = "sqlite"

[exports.WispRelay]
type = "durable-object"
storage = "sqlite"

# Isolated settings for Workers Builds branch previews. These bindings never
# point at production R2 data; Durable Object preview namespaces are isolated
# automatically by Cloudflare for each preview.
[previews.vars]
VM_BASELINE_ID = "admin"
ORACLE_ACCOUNT_EXEC_ENABLED = "false"
DOORDASH_ENVIRONMENT = "sandbox"

[[previews.r2_buckets]]
binding = "VM_SNAPSHOTS"
bucket_name = "vampirequid-preview-vm-snapshots"

[[previews.r2_buckets]]
binding = "PROJECT_STORAGE"
bucket_name = "vampirequid-preview-project-storage"

[[previews.durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[previews.durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[previews.durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[[previews.durable_objects.bindings]]
name = "VM_EXECUTION"
class_name = "VmExecution"

[[previews.durable_objects.bindings]]
name = "ACCOUNT_REGISTRY"
class_name = "AccountRegistry"

[[previews.durable_objects.bindings]]
name = "ACCOUNT_PROVISIONER"
class_name = "AccountProvisioner"

[[previews.durable_objects.bindings]]
name = "BUSINESS_DATABASE"
class_name = "BusinessDatabase"

[[previews.durable_objects.bindings]]
name = "INVENTORY_LEDGER"
class_name = "InventoryLedger"

[[previews.durable_objects.bindings]]
name = "WISP_RELAY"
class_name = "WispRelay"
