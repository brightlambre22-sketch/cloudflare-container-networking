name = "cloudflare-container-networking"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[exports.TunnelHub]
type = "durable-object"
storage = "sqlite"

[exports.NodeRegistry]
type = "durable-object"
storage = "sqlite"

[exports.NodeRuntime]
type = "durable-object"
storage = "sqlite"

[secrets]
required = ["DASHBOARD_ACCESS_KEY"]
