name = "cloudflare-container-networking"
main = "src/index.ts"
compatibility_date = "2026-10-07"
workers_dev = true

# The v86 emulator executes a full Linux guest in JavaScript/WASM. The default
# 30-second CPU budget is too small for kernel boot; allow the documented paid-plan
# maximum so the boot monitor can continue publishing progress instead of going stale.
[limits]
cpu_ms = 300000

# Generate the v86 bundle and compiled WASM before Wrangler resolves Worker imports.
# Required when deploying directly with `wrangler deploy` from Cloudflare's build environment.
[build]
command = "npm install --no-audit --no-fund && npm run build:headless-v86"

[[rules]]
type = "CompiledWasm"
globs = ["src/generated/v86.wasm"]
fallthrough = true

[assets]
directory = "../public"
binding = "ASSETS"

[[r2_buckets]]
binding = "VM_SNAPSHOTS"
bucket_name = "cloudflare-container-vm-snapshots"

[[durable_objects.bindings]]
name = "TUNNEL_HUB"
class_name = "TunnelHub"

[[durable_objects.bindings]]
name = "NODE_REGISTRY"
class_name = "NodeRegistry"

[[durable_objects.bindings]]
name = "NODE_RUNTIME"
class_name = "NodeRuntime"

[[durable_objects.bindings]]
name = "VM_EXECUTION"
class_name = "VmExecution"

[[durable_objects.bindings]]
name = "ACCOUNT_REGISTRY"
class_name = "AccountRegistry"

[exports.TunnelHub]
type = "durable-object"
storage = "sqlite"

[exports.NodeRegistry]
type = "durable-object"
storage = "sqlite"

[exports.NodeRuntime]
type = "durable-object"
storage = "sqlite"

[exports.VmExecution]
type = "durable-object"
storage = "sqlite"

[vars]
VM_BASELINE_ID = "v2"

[exports.AccountRegistry]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "ACCOUNT_PROVISIONER"
class_name = "AccountProvisioner"

[exports.AccountProvisioner]
type = "durable-object"
storage = "sqlite"
