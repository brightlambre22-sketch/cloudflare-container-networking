<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merchant orders · Vampirequid</title>
<style>
:root{--ink:#18231d;--muted:#66736b;--line:#dce4dd;--wash:#f5f7f4;--green:#176044}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line)}nav{max-width:1050px;margin:auto;padding:17px 22px;display:flex;gap:22px;align-items:center}nav strong{font-size:19px;margin-right:auto}a{color:var(--green);font-weight:650;text-decoration:none}
main{max-width:1050px;margin:38px auto;padding:0 22px}h1{font-size:30px;letter-spacing:-.04em;margin:0}p{color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;margin:22px 0}.toolbar button{border:0;border-radius:9px;background:var(--green);color:white;font:inherit;font-weight:700;padding:10px 16px;cursor:pointer}
#status{font-size:13px;color:var(--muted)}.orders{display:grid;gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.order-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.order-id{font-weight:800}.amount{font-weight:850;font-size:18px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.items{margin:12px 0 0;padding-left:20px}.empty{padding:32px;border:1px dashed #cbd5cc;border-radius:13px;text-align:center;background:white;color:var(--muted)}
</style>
</head>
<body>
<header><nav><a href="/" aria-label="Vampirequid home" style="display:flex;align-items:center;gap:10px;margin-right:auto;color:inherit;text-decoration:none"><img src="/vampire-quid.svg" alt="" width="42" height="42" style="object-fit:contain;border-radius:8px;background:#fff"><strong>Vampirequid · Merchant</strong></a><a href="/">Home</a><a href="/vm.html">Dashboard</a><a href="/merchant-location.html">Store location</a><a href="/marketplace">Marketplace</a><a href="/ambassador.html">Ambassador portal</a></nav></header>
<main>
<h1>Orders</h1><p>Customer payments and orders assigned to this merchant account.</p>
<div class="toolbar"><button id="refresh" type="button">Refresh orders</button><span id="status" role="status" aria-live="polite">Checking your merchant session…</span></div>
<section id="orders" class="orders"></section>
</main>
<script>
const status=document.getElementById("status"),list=document.getElementById("orders");
const el=(tag,cls,value)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n};
const money=cents=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(cents||0)/100);
let accountId="",token="";
async function load(){
 list.replaceChildren();status.textContent="Loading merchant orders…";
 try{
  const session=await fetch("/api/auth/session",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({account_id:accountId,session_token:token})});
  if(!session.ok)throw new Error("Your merchant session expired. Please log in again.");
  const response=await fetch("/api/stockroom/orders?account_id="+encodeURIComponent(accountId),{headers:{authorization:"Bearer "+token,accept:"application/json"},cache:"no-store"});
  const data=await response.json();if(!response.ok)throw new Error(data.error||"Could not load orders.");
  const orders=Array.isArray(data.orders)?data.orders:[];
  if(!orders.length){list.append(el("div","empty","No customer orders have been placed yet."));}
  for(const order of orders){
   const card=el("article","order"),head=el("div","order-head"),left=el("div","");
   left.append(el("div","order-id","Order "+String(order.order_id||"").slice(0,8).toUpperCase()),el("div","meta",new Date(order.created_at||Date.now()).toLocaleString()));
   const totalCents=Number.isFinite(Number(order.amount_cents))?Number(order.amount_cents):(Array.isArray(order.items)?order.items.reduce((sum,item)=>sum+Number(item.unit_price_cents||0)*Number(item.quantity||0),0):0);
   const amount=el("div","amount",money(totalCents));head.append(left,amount);card.append(head);
   const payment=String(order.payment_method||"payment").toUpperCase();
   const backend=data.stockroom_backend==="tinycore"?"TinyCore":"Cloudflare";
   const sync=order.sync_status==="synced"?"Synced to "+backend+" Stockroom":"Saved; Stockroom sync pending";
   card.append(el("div","meta",payment+" · Paid · "+sync));
   const items=el("ul","items");
   for(const item of (Array.isArray(order.items)?order.items:[])){
    const unit=Number(item.unit_price_cents||0);
    items.append(el("li","",String(item.quantity||1)+" × "+String(item.name||"Product")+" — "+money(unit*Number(item.quantity||1))));
   }
   card.append(items);list.append(card);
  }
  const syncSummary=data.tinycore_sync==="synchronized"?"TinyCore Stockroom synchronized":data.tinycore_sync==="not_configured"?"Cloudflare Stockroom active; TinyCore bridge not configured":"Orders retained online; TinyCore sync pending";
  status.textContent=orders.length+" order"+(orders.length===1?"":"s")+" · "+syncSummary;
 }catch(error){status.textContent=error.message||"Order history unavailable";status.style.color="#a12626"}
}
try{accountId=sessionStorage.getItem("vm-account-id")||"";token=sessionStorage.getItem("vm-session-token")||""}catch{}
if(!accountId||!token){status.textContent="Log in to your merchant account to view orders.";list.append(el("a","","Open merchant dashboard"));const link=list.querySelector("a");link.href="/vm.html"}
else load();
document.getElementById("refresh").addEventListener("click",load);
</script>
</body></html>
