<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mysterium Browser VM</title>
<style>
body{margin:0;background:#111;color:#ddd;font-family:monospace}
#status{padding:8px}
#toolbar{padding:8px;background:#181818;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;padding:6px 10px;cursor:pointer}
#copy-status{color:#8f8}
#myst-log{margin:0;padding:8px;height:220px;overflow:auto;white-space:pre-wrap;user-select:text;background:#000;color:#ddd;border-top:1px solid #333}
#results{box-sizing:border-box;width:100%;min-height:300px;background:#000;color:#ddd;border:1px solid #444;padding:8px;font:14px monospace;resize:vertical}
#screen_container{width:100%;min-height:480px}
</style>
</head>
<body>
<div id="status">Starting Linux VM...</div>
<div id="toolbar">
<button id="run-network-test" type="button">Run network test</button>
<button id="run-fineproxy-test" type="button">Run FineProxy test</button>
<button id="copy-results" type="button">Copy test results</button>
<button id="paste-terminal" type="button">Paste into VM</button>
<button id="clear-results" type="button">Clear results</button>
<span id="copy-status"></span>
</div>
<textarea id="results" spellcheck="false" placeholder="Full startup/network report. It is saved locally so you can copy it in sections."></textarea>
<pre id="myst-log">Waiting for Tiny Core...</pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="/v86/libv86.js"></script>
<script>
window.onload=function(){
const status=document.getElementById('status'),results=document.getElementById('results'),mystLog=document.getElementById('myst-log'),copyStatus=document.getElementById('copy-status');
const nodeId='7cbee0e9-da6b-4808-92a7-4a3c2a45a840',apiUrl=window.location.origin;
let reportTimer=null,bootstrapStarted=false;

function statusText(t){status.textContent=t}
const MAX_RESULTS_CHARS=120000;
function save(){try{localStorage.setItem('mysterium-network-test-results',results.value)}catch(e){}}
function report(t){
results.value+=(results.value?'\n':'')+t;
if(results.value.length>MAX_RESULTS_CHARS)results.value=results.value.slice(-MAX_RESULTS_CHARS);
results.scrollTop=results.scrollHeight;save()
}
try{const s=localStorage.getItem('mysterium-network-test-results');if(s)results.value=s.slice(-MAX_RESULTS_CHARS)}catch(e){}

document.getElementById('clear-results').onclick=function(){results.value='';save()};
document.getElementById('copy-results').onclick=async function(){
try{await navigator.clipboard.writeText(results.value)}catch(e){results.focus();results.select();document.execCommand('copy')}
copyStatus.textContent='Results copied.';setTimeout(()=>copyStatus.textContent='',1800)
};
async function pasteIntoVm(){
try{
const text=await navigator.clipboard.readText();if(!text)throw new Error('empty');
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')throw new Error('VM not ready');
window.emulator.keyboard_send_text(text);if(!/[\r\n]$/.test(text))window.emulator.keyboard_send_text('\n');
copyStatus.textContent='Pasted and executed.'
}catch(e){copyStatus.textContent='Paste blocked; use the button again.'}
setTimeout(()=>copyStatus.textContent='',3000)
}
document.getElementById('paste-terminal').onclick=pasteIntoVm;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='v'){e.preventDefault();pasteIntoVm()}});

function mirror(){
const s=document.querySelector('#screen_container > div'),t=(s&&s.textContent||'').trim();
if(t){mystLog.textContent=t;mystLog.scrollTop=mystLog.scrollHeight}
}
setInterval(mirror,500);

const diagnosticCommand='echo "===== NETWORK REPORT $(date) ====="; echo "--- id ---"; id; echo "--- interfaces ---"; ifconfig -a 2>&1; echo "--- ipv4 routes ---"; route -n 2>&1; echo "--- ipv6 routes ---"; route -A inet6 -n 2>&1; echo "--- kernel NIC ---"; dmesg | grep -Ei "eth|ne2k|ne2000|network|nic" 2>&1; echo "--- modules ---"; lsmod | grep -Ei "ne|8390|ether" 2>&1; echo "--- sockets ---"; netstat -lnptu 2>&1; echo "--- DNS ---"; cat /etc/resolv.conf 2>&1; echo "--- hostname ---"; hostname 2>&1; echo "--- busybox network ---"; busybox | grep -E "ifconfig|route|udhcpc|ping|ping6|netstat" 2>&1; echo "--- addresses via /proc ---"; cat /proc/net/dev 2>&1; echo "===== END NETWORK REPORT ====="';

function runDiagnostic(label){
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')return;
report('\n\n===== '+label+' =====\n'+diagnosticCommand+'\n');
window.emulator.keyboard_send_text(diagnosticCommand+'\n');
setTimeout(function(){
const s=document.querySelector('#screen_container > div');report('----- screen snapshot -----\n'+((s&&s.textContent)||'')+'\n----- end snapshot -----\n')
},9000)
}
document.getElementById('run-network-test').onclick=function(){runDiagnostic('MANUAL NETWORK TEST');statusText('Network test requested; results are being captured.')};
document.getElementById('run-fineproxy-test').onclick=function(){
const user=window.prompt('FineProxy SOCKS5 username:');
if(!user)return;
const pass=window.prompt('FineProxy SOCKS5 password:');
if(pass===null)return;
const proxies='104.245.241.241 104.245.242.42 104.245.242.79 140.235.1.156 140.235.170.229 140.235.2.179 140.235.2.87 140.235.3.108 140.235.3.135 140.235.3.210 146.19.44.139 162.252.53.183 162.252.54.45 162.252.55.11 162.252.55.238 166.88.178.235 166.88.178.53 167.253.16.43 167.253.19.143 172.83.253.92 176.126.104.142 176.126.111.39 178.20.28.176 178.20.28.198 178.20.31.222 185.202.108.61 185.77.220.200 185.77.220.73 185.77.222.124 185.77.222.200 192.101.65.46 192.101.66.105 192.101.67.56 193.142.36.218 193.142.39.151 193.142.39.208 193.151.189.191 193.151.190.214 193.151.190.69 193.163.207.99 193.202.16.240 193.31.127.25 193.42.245.129 194.110.150.232 194.180.236.157 194.180.236.37 194.70.234.63 194.70.234.73 194.99.25.61 194.99.26.103 194.99.26.99 194.99.27.233 194.99.27.79 199.96.164.65 212.18.113.111 212.18.113.53 212.18.113.65 212.87.218.179 216.40.73.14 31.40.195.121 45.133.113.18 45.133.114.76 45.133.115.12 45.136.25.175 45.136.27.203 45.147.232.227 45.147.232.85 45.147.233.176 45.147.234.212 45.147.234.76 45.147.235.109 45.147.235.201 45.159.22.13 45.159.22.223 45.159.22.232 46.253.131.253 62.204.49.156 64.49.36.132 64.49.36.135 64.49.37.18 64.49.38.75 64.49.39.250 77.83.26.19 77.83.27.154 77.83.27.178 77.83.27.45 77.83.27.61 83.97.116.222 83.97.118.103 88.218.45.157 88.218.47.124 88.218.47.39 89.19.35.156 89.19.35.48 91.132.124.100 91.132.125.195 91.132.125.85 91.246.51.192 94.154.113.166';
const safeUser=user.replace(/'/g,"'\\''"),safePass=pass.replace(/'/g,"'\\''");
const cmd="tce-load -wil curl.tcz >/tmp/fp-install.log 2>&1; mkdir -p /tmp/fp-inbound; (while true; do echo MYSTERIUM_TCP_INBOUND_$(date +%s) | busybox nc -l -p 18080; done >/tmp/fp-inbound/tcp.log 2>&1 &) ; (while true; do busybox nc -u -l -p 18081; done >/tmp/fp-inbound/udp.log 2>&1 &) ; echo '===== FINEPROXY MYSTERIUM TEST ====='; echo '--- inbound listeners ---'; echo 'TCP=18080 UDP=18081'; echo '--- outbound SOCKS5 tests ---'; for IP in "+proxies+"; do START=$(date +%s); EXITIP=$(curl -4 -sS --socks5-hostname \"$IP:1080\" --proxy-user '"+safeUser+":"+safePass+"' --connect-timeout 5 --max-time 8 https://api.ipify.org 2>/tmp/fp.err); RC=$?; END=$(date +%s); if [ $RC -eq 0 ] && [ -n \"$EXITIP\" ]; then echo \"OUTBOUND PASS proxy=$IP exit_ipv4=$EXITIP seconds=$((END-START))\"; else echo \"OUTBOUND FAIL proxy=$IP rc=$RC seconds=$((END-START))\"; fi; done; echo '--- inbound test state ---'; netstat -lnptu 2>&1 | grep -E ':18080|:18081' || true; echo 'INBOUND PASS requires an external packet to reach TCP/UDP 18080/18081 through the FineProxy public IP.'; echo '===== END FINEPROXY MYSTERIUM TEST =====';";
report('\n===== FINEPROXY MYSTERIUM TEST =====\n');
window.emulator.keyboard_send_text(cmd+'\n');
statusText('FineProxy outbound tests and inbound listeners running.');
setTimeout(function(){const s=document.querySelector('#screen_container > div');const t=(s&&s.textContent)||'';report(t.slice(-30000));statusText('FineProxy test output captured.');},30000);
};

function startBootstrap(){
if(bootstrapStarted)return;bootstrapStarted=true;statusText('Tiny Core ready; running full Mysterium bootstrap.');
const commands=[
'sudo udhcpc -n -q -i eth0',
'tce-load -wil openssl-1.1.1.tcz ca-certificates.tcz',
'wget -q -O /tmp/cloudflare-browser-bootstrap.sh https://raw.githubusercontent.com/brightlambre22-sketch/cloudflare-container-networking/refs/heads/main/runner/tinycore/browser-bootstrap.sh; rc=$?; echo __BOOTSTRAP_DOWNLOAD_DONE:$rc',
'if [ -f /tmp/cloudflare-browser-bootstrap.sh ]; then sh /tmp/cloudflare-browser-bootstrap.sh '+apiUrl+' '+nodeId+'; rc=$?; echo __BOOTSTRAP_RUN_DONE:$rc; else echo __BOOTSTRAP_RUN_DONE:download_failed; fi',
'if [ ! -x /opt/cloudflare-node/myst-supervisor.sh ] || [ ! -x /opt/cloudflare-node/cloudflare-runner.sh ] || [ ! -x /opt/mysterium/myst ]; then echo "BOOTSTRAP FAILED: required files are missing"; ls -l /opt/cloudflare-node /opt/mysterium 2>/dev/null || true; else echo "__BOOTSTRAP_VERIFY_DONE:ok"; fi',
'if [ -x /opt/cloudflare-node/myst-supervisor.sh ]; then nohup /opt/cloudflare-node/myst-supervisor.sh >/var/log/myst-supervisor-console.log 2>&1 & fi; echo __SUPERVISOR_DONE',
'if [ -x /opt/cloudflare-node/cloudflare-runner.sh ]; then nohup /opt/cloudflare-node/cloudflare-runner.sh >/var/log/cloudflare-runner-console.log 2>&1 & fi; echo __RUNNER_DONE'
];
const markers=[null,null,'__BOOTSTRAP_DOWNLOAD_DONE:','__BOOTSTRAP_RUN_DONE:','__BOOTSTRAP_VERIFY_DONE:','__SUPERVISOR_DONE','__RUNNER_DONE'];
const timeouts=[45000,120000,30000,360000,15000,10000,10000];
let i=0;
function terminal(){const s=document.querySelector('#screen_container > div');return(s&&s.textContent)||''}
function next(){
if(i>=commands.length){
statusText('Bootstrap finished; collecting network report. Mysterium processes remain running.');
report('\n===== FULL BOOTSTRAP COMPLETE =====\n');
runDiagnostic('POST-BOOT NETWORK TEST');
return;
}
const n=i++,cmd=commands[n],marker=markers[n];
report('\n===== BOOTSTRAP STEP '+(n+1)+'/'+commands.length+' =====\n'+cmd+'\n');
window.emulator.keyboard_send_text(cmd+'\n');
if(marker){
const started=Date.now();
(function wait(){
if(terminal().indexOf(marker)>=0){next();return}
if(Date.now()-started>=timeouts[n]){
report('*** TIMEOUT waiting for '+marker+'; continuing to next step ***\n');
next();return
}
setTimeout(wait,500)
})()
}else setTimeout(next,timeouts[n])
}
next()
}

statusText('Loading v86...');
try{
window.emulator=new V86({
wasm_path:'/v86/v86.wasm',memory_size:128*1024*1024,vga_memory_size:8*1024*1024,
screen_container:document.getElementById('screen_container'),
bios:{url:'/bios/seabios.bin'},vga_bios:{url:'/bios/vgabios.bin'},
cdrom:{url:'/boot/TinyCore-11.0.iso'},
net_device:{type:'ne2k',relay_url:'wss://relay.widgetry.org/'},
network_relay_url:'wss://relay.widgetry.org/',autostart:true
});
statusText('Linux VM starting; full bootstrap will run at Tiny Core prompt.');
let bootSent=false;
setTimeout(function(){
if(bootSent)return;bootSent=true;
try{
if(typeof window.emulator.keyboard_send_scancodes==='function')window.emulator.keyboard_send_scancodes([0x50,0x50,0x1c]);
else if(typeof window.emulator.keyboard_send_keys==='function')window.emulator.keyboard_send_keys(['ARROWDOWN','ARROWDOWN','ENTER'])
}catch(e){}
},1500);
const started=Date.now();
(function wait(){
const s=document.querySelector('#screen_container > div'),t=(s&&s.textContent)||'';
if(/tc@box|tc@/.test(t)){startBootstrap();return}
if(Date.now()-started>=120000){statusText('Tiny Core prompt not detected.');return}
setTimeout(wait,500)
})()
}catch(e){statusText('VM ERROR: '+e.message)}
};
</script>
</body>
</html>
