<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mysterium Browser VM</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: monospace; }
  #status { padding: 8px; }
  #toolbar { padding: 8px; background: #181818; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 6px 10px; cursor: pointer; }
  #copy-status { color: #8f8; }
  #myst-log { margin: 0; padding: 8px; height: 220px; overflow: auto; white-space: pre-wrap; user-select: text; background: #000; color: #ddd; border-top: 1px solid #333; }
  #screen_container { width: 100%; min-height: 480px; }
</style>
</head>
<body>
<div id="status">Starting Linux VM...</div>
<div id="toolbar">
  <button id="copy-errors" type="button">Copy terminal text</button>
  <span id="copy-status"></span>
</div>
<pre id="myst-log">Waiting for Tiny Core...</pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="/v86/libv86.js"></script>
<script>
window.onload=function(){
  const status=document.getElementById('status');
  const nodeId='7cbee0e9-da6b-4808-92a7-4a3c2a45a840';
  const apiUrl=window.location.origin;
  const mystLog=document.getElementById('myst-log');
  const copyStatus=document.getElementById('copy-status');
  document.getElementById('copy-errors').addEventListener('click',async function(){
    const text=(mystLog.textContent || '').trim();
    try {
      await navigator.clipboard.writeText(text);
      copyStatus.textContent='Copied.';
      setTimeout(function(){ copyStatus.textContent=''; },1500);
    } catch(e) {
      const area=document.createElement('textarea');
      area.value=text;
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      copyStatus.textContent='Copied.';
      setTimeout(function(){ copyStatus.textContent=''; },1500);
    }
  });
  function mirrorTerminal(){
    const screen=document.querySelector('#screen_container > div');
    const text=(screen && screen.textContent || '').trim();
    if(text) {
      mystLog.textContent=text;
      mystLog.scrollTop=mystLog.scrollHeight;
    }
  }

  function startBrowserBootstrap(){
    if (window.__browserBootstrapStarted) return;
    window.__browserBootstrapStarted=true;
    status.textContent='Tiny Core ready; running automated diagnostics...';

    const commands=[
      'echo "===== DIAGNOSTIC START ====="; date; uname -a; id',
      'echo "===== NETWORK ====="; (ip addr || ifconfig) 2>&1; echo "--- ROUTE ---"; (ip route || route -n) 2>&1; echo "--- DNS ---"; cat /etc/resolv.conf 2>&1',
      'echo "===== DHCP TEST ====="; sudo udhcpc -n -q -i eth0 2>&1; echo DHCP_RC:$?',
      'echo "===== INTERNET TEST ====="; (wget -S -O /dev/null --timeout=10 https://example.com) 2>&1; echo INTERNET_RC:$?',
      'echo "===== GITHUB BOOTSTRAP TEST ====="; url=https://raw.githubusercontent.com/brightlambre22-sketch/cloudflare-container-networking/refs/heads/main/runner/tinycore/browser-bootstrap.sh; wget -S -O /tmp/debug-browser-bootstrap.sh "$url" 2>&1; rc=$?; echo DOWNLOAD_RC:$rc; if [ -f /tmp/debug-browser-bootstrap.sh ]; then wc -c /tmp/debug-browser-bootstrap.sh; sha256sum /tmp/debug-browser-bootstrap.sh; head -n 12 /tmp/debug-browser-bootstrap.sh; fi',
      'echo "===== REPO VERSION ====="; wget -q -O - https://api.github.com/repos/brightlambre22-sketch/cloudflare-container-networking/commits/main 2>&1 | grep -E '"sha"|"message"' | head -n 4',
      'echo "===== LOCAL FILES ====="; ls -la /opt/mysterium /opt/cloudflare-node /etc/cloudflare-node 2>&1; echo "--- PROCESS ---"; ps 2>&1 | grep -E "myst|cloudflare|supervisor" | grep -v grep || true',
      'echo "===== LOGS ====="; for f in /var/log/mysterium-node.log /var/log/myst-supervisor-console.log /var/log/cloudflare-runner-console.log /var/log/cloudflare-node-boot.log; do echo "--- $f ---"; tail -n 60 "$f" 2>&1 || true; done',
      'echo "===== DIAGNOSTIC COMPLETE ====="; echo "Copy everything from DIAGNOSTIC START through DIAGNOSTIC COMPLETE."'
    ];

    let index=0;
    function sendNext(){
      if(index>=commands.length){
        status.textContent='Diagnostics complete — copy the terminal output.';
        return;
      }
      const command=commands[index++];
      status.textContent='Running diagnostic '+index+'/'+commands.length+'...';
      window.emulator.keyboard_send_text(command+'\\n');
      setTimeout(sendNext,index===5?15000:2500);
    }
    sendNext();
  }

  status.textContent='Loading v86...';
  try {
    window.emulator=new V86({
      wasm_path:'/v86/v86.wasm',
      memory_size:128*1024*1024,
      vga_memory_size:8*1024*1024,
      screen_container:document.getElementById('screen_container'),
      bios:{url:'/bios/seabios.bin'},
      vga_bios:{url:'/bios/vgabios.bin'},
      cdrom:{url:'/boot/TinyCore-11.0.iso'},
      net_device:{type:'ne2k',relay_url:'wss://relay.widgetry.org/'},
      network_relay_url:'wss://relay.widgetry.org/',
      autostart:true
    });
    status.textContent='Linux VM starting with network...';

    let commandLineModeStarted=false;
    function sendCommandLineBoot(){
      if(commandLineModeStarted) return;
      commandLineModeStarted=true;
      setTimeout(function(){
        try {
          if(window.emulator && typeof window.emulator.keyboard_send_scancodes==='function'){
            window.emulator.keyboard_send_scancodes([0x50,0x50,0x1c]);
          } else if(window.emulator && typeof window.emulator.keyboard_send_keys==='function'){
            window.emulator.keyboard_send_keys(['ARROWDOWN','ARROWDOWN','ENTER']);
          }
        } catch(e) { console.error(e); }
      },1500);
    }

    function tinyCorePromptVisible(){
      const textScreen=document.querySelector('#screen_container > div');
      const text=(textScreen && textScreen.textContent) || '';
      return /tc@box|tc@/.test(text);
    }

    function waitForTinyCorePrompt(timeoutMs){
      return new Promise(function(resolve,reject){
        const started=Date.now();
        function check(){
          if(tinyCorePromptVisible()){ resolve(true); return; }
          if(Date.now()-started >= timeoutMs){
            reject(new Error('Tiny Core prompt not detected within '+Math.round(timeoutMs/1000)+' seconds'));
            return;
          }
          setTimeout(check,500);
        }
        check();
      });
    }

    sendCommandLineBoot();
    setInterval(mirrorTerminal,500);

    waitForTinyCorePrompt(120000)
      .then(function(){ startBrowserBootstrap(); })
      .catch(function(error){
        console.error(error);
        status.textContent='VM bootstrap wait failed: '+error.message;
      });
  } catch(e) {
    console.error(e);
    status.textContent='VM ERROR: '+e.message;
  }
};
</script>
</body>
</html>
