<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browser VM</title>
<script>if(window.top===window.self){window.location.replace("/dashboard.html");}</script>
<style>
body{margin:0;background:#111;color:#ddd;font-family:monospace}
#status{padding:8px}
#toolbar{padding:8px;background:#181818;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;padding:6px 10px;cursor:pointer}
#copy-status{color:#8f8}
#vm-log{margin:0;padding:8px;height:220px;overflow:auto;white-space:pre-wrap;user-select:text;background:#000;color:#ddd;border-top:1px solid #333}
#results{box-sizing:border-box;width:100%;min-height:300px;background:#000;color:#ddd;border:1px solid #444;padding:8px;font:14px monospace;resize:vertical}
#screen_container{width:100%;min-height:480px}
</style>
</head>
<body>
<div id="status">Starting Linux VM...</div>
<div id="toolbar">
<button id="run-network-test" type="button">Run network test</button>
<button id="copy-results" type="button">Copy test results</button>
<button id="paste-terminal" type="button">Paste into VM</button>
<button id="clear-results" type="button">Clear results</button>
<span id="copy-status"></span>
</div>
<textarea id="results" spellcheck="false" placeholder="Full startup/network report. It is saved locally so you can copy it in sections."></textarea>
<pre id="vm-log">Waiting for Tiny Core...</pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="/v86/libv86.js"></script>
<script>
window.onload=function(){
const status=document.getElementById('status'),results=document.getElementById('results'),mystLog=document.getElementById('vm-log'),copyStatus=document.getElementById('copy-status');
const nodeId='7cbee0e9-da6b-4808-92a7-4a3c2a45a840',apiUrl=window.location.origin;
let reportTimer=null,bootstrapStarted=false,bootComplete=false;

function statusText(t){status.textContent=t}

const SNAPSHOT_DB_NAME='mysterium-v86-snapshots-v1',SNAPSHOT_STORE='snapshots';
let snapshotKey=null,snapshotDbPromise=null,snapshotSaveBusy=false,snapshotReady=false;
function openSnapshotDb(){
 if(snapshotDbPromise)return snapshotDbPromise;
 snapshotDbPromise=new Promise((resolve,reject)=>{
  const request=indexedDB.open(SNAPSHOT_DB_NAME,1);
  request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(SNAPSHOT_STORE))db.createObjectStore(SNAPSHOT_STORE,{keyPath:'key'});};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('Could not open snapshot storage'));
 });
 return snapshotDbPromise;
}
async function snapshotGet(){
 const db=await openSnapshotDb();
 return new Promise((resolve,reject)=>{
  const request=db.transaction(SNAPSHOT_STORE,'readonly').objectStore(SNAPSHOT_STORE).get(snapshotKey);
  request.onsuccess=()=>resolve(request.result||null);
  request.onerror=()=>reject(request.error||new Error('Could not read saved VM state'));
 });
}
async function snapshotPut(record){
 const db=await openSnapshotDb();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(SNAPSHOT_STORE,'readwrite');
  tx.objectStore(SNAPSHOT_STORE).put(record);
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error||new Error('Could not save VM state'));
  tx.onabort=()=>reject(tx.error||new Error('VM state save was aborted'));
 });
}
async function initializeSnapshotIdentity(){
 const response=await fetch('/api/auth/session',{credentials:'same-origin',cache:'no-store'});
 if(!response.ok)throw new Error('Could not identify the signed-in account for VM persistence');
 const session=await response.json();
 if(!session||typeof session.username!=='string'||!/^[a-z0-9._-]{3,32}$/.test(session.username))throw new Error('Session did not return a valid account');
 snapshotKey=session.username+':'+nodeId;
 snapshotReady=true;
 return snapshotGet();
}
function restoreEmulatorState(state){
 return new Promise((resolve,reject)=>{
  try{window.emulator.restore_state(state,(error)=>error?reject(error):resolve());}
  catch(error){reject(error);}
 });
}
function exportEmulatorState(){
 return new Promise((resolve,reject)=>{
  try{window.emulator.save_state((error,state)=>{if(error)reject(error);else if(state==null)reject(new Error('v86 returned an empty snapshot'));else resolve(state);});}
  catch(error){reject(error);}
 });
}
async function saveVmSnapshot(reason){
 if(!snapshotReady||snapshotSaveBusy||!window.emulator||typeof window.emulator.save_state!=='function')return;
 snapshotSaveBusy=true;
 try{
  const state=await exportEmulatorState();
  await snapshotPut({key:snapshotKey,state,savedAt:Date.now(),version:1});
  if(reason)report('\\nVM SNAPSHOT SAVED ('+reason+')\\n');
 }catch(error){
  report('\\nVM SNAPSHOT SAVE FAILED: '+(error&&error.message?error.message:String(error))+'\\n');
 }finally{snapshotSaveBusy=false;}
}
async function clearVmSnapshot(){
 if(!snapshotReady)return;
 try{
  const db=await openSnapshotDb();
  await new Promise((resolve,reject)=>{
   const tx=db.transaction(SNAPSHOT_STORE,'readwrite');
   tx.objectStore(SNAPSHOT_STORE).delete(snapshotKey);
   tx.oncomplete=resolve;
   tx.onerror=()=>reject(tx.error||new Error('Could not clear saved VM state'));
  });
 }catch(error){report('\\nCould not clear VM snapshot: '+(error&&error.message?error.message:String(error))+'\\n');}
}
window.addEventListener('message',function(event){
if(event.origin!==window.location.origin||!event.data||event.data.type!=='vm-control')return;
try{
if(event.data.action==='start'){if(window.emulator&&typeof window.emulator.run==='function'){window.emulator.run();statusText('VM resumed.');}}
else if(event.data.action==='stop'){if(window.emulator&&typeof window.emulator.stop==='function'){window.emulator.stop();statusText('VM paused by dashboard.');saveVmSnapshot('dashboard pause');}}
else if(event.data.action==='reboot'){if(window.emulator&&typeof window.emulator.restart==='function'){clearVmSnapshot();window.emulator.restart();statusText('VM reboot requested.');}else{statusText('Reboot is not supported by this v86 build.');}}
}catch(error){statusText('VM control failed: '+error.message)}
});
function save(){try{localStorage.setItem('mysterium-network-test-results',results.value)}catch(e){}}
function report(t){results.value+=t;results.scrollTop=results.scrollHeight;save()}
window.addEventListener('error',function(event){
 const message='BROWSER ERROR: '+(event.message||'unknown error')+(event.filename?' ('+event.filename+':'+event.lineno+')':'');
 statusText(message);report('\\n'+message+'\\n');
});
window.addEventListener('unhandledrejection',function(event){
 const reason=event.reason&&event.reason.message?event.reason.message:String(event.reason||'unknown rejection');
 const message='UNHANDLED PROMISE REJECTION: '+reason;
 statusText(message);report('\\n'+message+'\\n');
});
try{const s=localStorage.getItem('mysterium-network-test-results');if(s)results.value=s}catch(e){}

document.getElementById('clear-results').onclick=function(){results.value='';save()};
document.getElementById('copy-results').onclick=async function(){
try{await navigator.clipboard.writeText(results.value)}catch(e){results.focus();results.select();document.execCommand('copy')}
copyStatus.textContent='Results copied.';setTimeout(()=>copyStatus.textContent='',1800)
};
async function pasteIntoVm(){
try{
const text=await navigator.clipboard.readText();if(!text)throw new Error('empty');
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')throw new Error('VM not ready');
window.emulator.keyboard_send_text(text);if(!/[\r\n]$/.test(text))window.emulator.keyboard_send_text('\n');
copyStatus.textContent='Pasted and executed.'
}catch(e){copyStatus.textContent='Paste blocked; use the button again.'}
setTimeout(()=>copyStatus.textContent='',3000)
}
document.getElementById('paste-terminal').onclick=pasteIntoVm;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='v'){e.preventDefault();pasteIntoVm()}});

function shellPrompt(text){
const normalized=String(text||'').replace(/\r/g,'').replace(/\u00a0/g,' ');
const lines=normalized.split('\n').map(line=>line.trim()).filter(Boolean);
const promptPattern=/^tc@box(?::[^\n]{0,80})?\s*[$#]\s*$/;
const lastLine=lines.length?lines[lines.length-1]:'';
return promptPattern.test(lastLine)?lastLine:'';
}
function screenText(){
if(window.emulator&&window.emulator.screen_adapter&&typeof window.emulator.screen_adapter.get_text_screen==='function'){
return window.emulator.screen_adapter.get_text_screen().join('\n');
}
const s=document.querySelector('#screen_container > div');
return(s&&s.textContent)||'';
}
function mirror(){
const t=screenText().trim();
if(t){mystLog.textContent=t;mystLog.scrollTop=mystLog.scrollHeight}
}
setInterval(mirror,500);

const diagnosticCommand=`wget -T 20 -q -O /tmp/network-test.sh ${apiUrl}/runner/tinycore/network-test.sh; dl=$?; echo NETWORK_TEST_DOWNLOAD_RC=$dl; if [ "$dl" -eq 0 ]; then sh /tmp/network-test.sh; else echo NETWORK_TEST_DOWNLOAD_FAILED; fi`;

function runDiagnostic(label){
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')return;
report('\n\n===== '+label+' =====\n'+diagnosticCommand+'\n');
window.emulator.keyboard_send_text(diagnosticCommand+'\n');
setTimeout(function(){
report('----- screen snapshot -----\n'+screenText()+'\n----- end snapshot -----\n')
},9000)
}
document.getElementById('run-network-test').onclick=function(){runDiagnostic('MANUAL NETWORK TEST');statusText('Network test requested; results are being captured.')};

async function sendVmCommand(cmd){
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')throw new Error('v86 keyboard API unavailable');
if(typeof window.emulator.keyboard_set_enabled==='function')window.emulator.keyboard_set_enabled(true);
await window.emulator.keyboard_send_text(cmd,2);
await new Promise(r=>setTimeout(r,250));
}

async function startBootstrap(){
if(bootstrapStarted)return;bootstrapStarted=true;statusText('Tiny Core ready; running full startup sequence.');
const commands=[
`echo "--- NETWORK INIT ---"; id; sudo -n sh -c 'set +e; /sbin/ifconfig eth0 up; /sbin/udhcpc -f -n -q -t 5 -T 3 -i eth0; rc=$?; echo DHCP_RC=$rc; /sbin/ifconfig eth0; /sbin/route -n; if [ "$rc" -eq 0 ] && /sbin/ifconfig eth0 | grep -Eq "inet (addr:)?([0-9]{1,3}[.]){3}[0-9]{1,3}" && /sbin/route -n | grep -Eq "^0[.]0[.]0[.]0[[:space:]]+[1-9][0-9]*[.]"; then echo DHCP_OK; else echo DHCP_FAIL; fi'; echo DHCP_DONE`,
'echo "--- RESOURCE PREFLIGHT ---"; df -h / /tmp /usr/local/tce 2>&1; free 2>&1; cat /proc/meminfo 2>/dev/null | head -n 8; echo "--- OPENSSL PACKAGE ---"; tce-load -wil openssl-1.1.1.tcz; rc=$?; echo OPENSSL_RC=$rc; printf "\\n__OPENSSL_DONE:%s\\n" "$rc"',
'tce-load -w ca-certificates.tcz; rc=$?; echo CA_CERTIFICATES_DOWNLOAD_RC=$rc; printf "\\n__CA_CERTIFICATES_DOWNLOAD_%s:%s\\n" DONE "$rc"',
`wget -q -O /tmp/cloudflare-browser-bootstrap.sh ${apiUrl}/runner/tinycore/browser-bootstrap.sh; rc=$?; printf "\\n__BOOTSTRAP_DOWNLOAD_%s:%s\\n" DONE "$rc"`,
`if [ -f /tmp/cloudflare-browser-bootstrap.sh ]; then tce-load -wil ca-certificates.tcz && sh /tmp/cloudflare-browser-bootstrap.sh ${apiUrl} ${nodeId}; rc=$?; printf "\\n__BOOTSTRAP_RUN_%s:%s\\n" DONE "$rc"; else printf "__BOOTSTRAP_RUN_%s:%s" DONE download_failed; fi`,
'echo "--- CA CERTIFICATE INSTALL STATUS ---"; if [ -f /tmp/ca-certificates-install.rc ]; then echo CA_CERTIFICATES_RC=$(cat /tmp/ca-certificates-install.rc); tail -n 20 /tmp/ca-certificates-install.log; else echo CA_CERTIFICATES_STATUS=STILL_RUNNING; tail -n 20 /tmp/ca-certificates-install.log; fi; if [ ! -x /opt/cloudflare-node/myst-supervisor.sh ] || [ ! -x /opt/cloudflare-node/cloudflare-runner.sh ] || [ ! -x /opt/mysterium/myst ]; then echo "BOOTSTRAP FAILED: required files are missing"; ls -l /opt/cloudflare-node /opt/mysterium 2>/dev/null || true; printf "%s\\n" failed > /tmp/bootstrap-step-5.done; printf "\\n__BOOTSTRAP_VERIFY_%s:%s\\n" DONE failed; else printf "%s\\n" ok > /tmp/bootstrap-step-5.done; printf "\\n__BOOTSTRAP_VERIFY_%s:%s\\n" DONE ok; fi',
'if [ -x /opt/cloudflare-node/myst-supervisor.sh ]; then nohup /opt/cloudflare-node/myst-supervisor.sh >/var/log/myst-supervisor-console.log 2>&1 & fi; printf "\\n__SUPERVISOR_%s\\n" DONE',
'if [ -x /opt/cloudflare-node/cloudflare-runner.sh ]; then nohup /opt/cloudflare-node/cloudflare-runner.sh >/var/log/cloudflare-runner-console.log 2>&1 & fi; printf "\\n__RUNNER_%s\\n" DONE'
];
const markers=['DHCP_DONE','__OPENSSL_DONE:','__CA_CERTIFICATES_DOWNLOAD_DONE:','__BOOTSTRAP_DOWNLOAD_DONE:','__BOOTSTRAP_RUN_DONE:','__BOOTSTRAP_VERIFY_DONE:','__SUPERVISOR_DONE','__RUNNER_DONE'];
const timeouts=[30000,180000,30000,30000,900000,15000,10000,10000];
let i=0;
function terminal(){return screenText()}
async function next(){
if(i>=commands.length){
statusText('Bootstrap finished. Background services remain running.');
report('\\n===== FULL BOOTSTRAP COMPLETE =====\\n');
return;
}
const n=i++,cmd=commands[n],marker=markers[n];
report('\n===== BOOTSTRAP STEP '+(n+1)+'/'+commands.length+' =====\n'+cmd+'\n');
await sendVmCommand('clear; '+cmd+'\n');
if(marker){
const started=Date.now();
(function wait(){
if(terminal().indexOf(marker)>=0 && shellPrompt(terminal())){
report('----- bootstrap screen snapshot -----\n'+terminal()+'\n----- end bootstrap screen snapshot -----\n');
if(marker==='DHCP_DONE'&&!terminal().includes('DHCP_OK')){report('*** DHCP did not install a usable IPv4 address and default route. No guessed gateway will be added; stopping before package/bootstrap downloads. ***\\n');statusText('DHCP/default-route check failed; diagnostics captured.');return} if(marker==='__OPENSSL_DONE:'&&!terminal().includes('__OPENSSL_DONE:0')){report('*** OpenSSL package installation failed; stopping startup.');statusText('Bootstrap stopped: OpenSSL package setup failed.');return} if(marker==='__CA_CERTIFICATES_DOWNLOAD_DONE:'&&!terminal().includes('__CA_CERTIFICATES_DOWNLOAD_DONE:0')){report('*** CA certificate package download failed; stopping before HTTPS bootstrap. ***\\n');statusText('CA package download failed.');return} 

if(marker==='__BOOTSTRAP_VERIFY_DONE:'&&terminal().includes('__BOOTSTRAP_VERIFY_DONE:failed')){report('*** Required startup files are missing; runner launch aborted. ***\n');statusText('Bootstrap stopped: required files are missing.');return}
next();return
}
if(Date.now()-started>=timeouts[n]){
report('*** TIMEOUT waiting for '+marker+'; stopping startup sequence; no later commands were sent. ***\n----- timeout screen snapshot -----\n'+terminal()+'\n----- end timeout screen snapshot -----\n');
statusText('Bootstrap stopped: timed out waiting for '+marker+'. No later commands were sent.');return
}
setTimeout(wait,500)
})()
}else setTimeout(next,timeouts[n])
}
next()
}

results.value='';save();report('\n===== NEW VM RUN =====\n');
statusText('Loading v86...');
try{
window.emulator=new V86({
wasm_path:'/v86/v86.wasm',memory_size:128*1024*1024,vga_memory_size:8*1024*1024,
screen_container:document.getElementById('screen_container'),
bios:{url:'/bios/seabios.bin'},vga_bios:{url:'/bios/vgabios.bin'},
cdrom:{url:'/boot/TinyCorePure64-11.0-v86-ne2k-dhcp-experimental.iso'},
net_device:{type:'ne2k',relay_url:'wss://relay.widgetry.org/'},
network_relay_url:'wss://relay.widgetry.org/',autostart:false
});
if(window.emulator&&typeof window.emulator.add_listener==='function'){
 window.emulator.add_listener('emulator-ready',function(){
  statusText('v86 initialized; checking for a saved VM snapshot.');
  report('\\nV86 EVENT: emulator-ready\\n');
  (async function(){
   try{
    const snapshot=await initializeSnapshotIdentity();
    if(snapshot&&snapshot.version===1&&snapshot.state!=null){
     try{
      await restoreEmulatorState(snapshot.state);
      report('\\nVM SNAPSHOT RESTORED from '+new Date(snapshot.savedAt||0).toISOString()+'\\n');
      statusText('Saved VM state restored; resuming Tiny Core.');
     }catch(error){
      report('\\nSaved VM snapshot could not be restored; starting fresh: '+(error&&error.message?error.message:String(error))+'\\n');
      await clearVmSnapshot();
     }
    }else report('\\nNo saved VM snapshot for this account; starting fresh.\\n');
   }catch(error){
    report('\\nVM snapshot persistence unavailable; starting fresh: '+(error&&error.message?error.message:String(error))+'\\n');
   }
   if(window.emulator&&typeof window.emulator.run==='function')window.emulator.run();
  })();
 });
 window.emulator.add_listener('emulator-started',function(){report('\\nV86 EVENT: emulator-started\\n');});
 window.emulator.add_listener('emulator-stopped',function(){report('\\nV86 EVENT: emulator-stopped\\n');});
 window.emulator.add_listener('download-progress',function(event){
  if(event&&typeof event.loaded==='number'&&typeof event.total==='number'&&event.total>0){statusText('Loading VM resources: '+Math.round(event.loaded/event.total*100)+'%');}
 });
}
statusText('v86 object created; waiting for emulator initialization.');
const started=Date.now();
let promptCandidate='',promptCandidateSince=0;
const BOOT_TIMEOUT_MS=15*60*1000,PROMPT_STABLE_MS=2000;
function shellPrompt(text){
const normalized=String(text||'').replace(/\r/g,'').replace(/\u00a0/g,' ');
const lines=normalized.split('\n').map(line=>line.trim()).filter(Boolean);
const promptPattern=/^tc@box(?::[^\n]{0,80})?\s*[$#]\s*$/;
for(let i=lines.length-1;i>=Math.max(0,lines.length-6);i--){
if(promptPattern.test(lines[i]))return lines[i];
}
return '';
}
setInterval(function(){if(bootComplete)saveVmSnapshot('periodic checkpoint');},60000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&bootComplete)saveVmSnapshot('page hidden');});
window.addEventListener('pagehide',function(){if(bootComplete)saveVmSnapshot('page exit');});
statusText('Tiny Core is booting; waiting for a stable shell prompt before sending commands.');
(function waitForBootComplete(){
const t=screenText();
const prompt=shellPrompt(t);
if(prompt){
if(prompt===promptCandidate){
if(Date.now()-promptCandidateSince>=PROMPT_STABLE_MS){
bootComplete=true;
saveVmSnapshot('Tiny Core shell ready');
statusText('Tiny Core shell prompt is stable; starting bootstrap.');
startBootstrap();
return;
}
}else{promptCandidate=prompt;promptCandidateSince=Date.now();}
}else{promptCandidate='';promptCandidateSince=0;}
if(Date.now()-started>=BOOT_TIMEOUT_MS){
statusText('Tiny Core did not reach a stable shell prompt within 15 minutes. No commands were sent.');
report('*** BOOT TIMEOUT: no stable Tiny Core shell prompt detected; no commands were sent. ***\n');
return;
}
setTimeout(waitForBootComplete,500);
})()
}catch(e){statusText('VM ERROR: '+e.message)}
};
</script>
</body>
</html>
