<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mysterium Browser VM</title>
<style>
body{margin:0;background:#111;color:#ddd;font-family:monospace}
#status{padding:8px}
#toolbar{padding:8px;background:#181818;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;padding:6px 10px;cursor:pointer}
#copy-status{color:#8f8}
#myst-log{margin:0;padding:8px;height:220px;overflow:auto;white-space:pre-wrap;user-select:text;background:#000;color:#ddd;border-top:1px solid #333}
#results{box-sizing:border-box;width:100%;min-height:300px;background:#000;color:#ddd;border:1px solid #444;padding:8px;font:14px monospace;resize:vertical}
#screen_container{width:100%;min-height:480px}
</style>
</head>
<body>
<div id="status">Starting Linux VM...</div>
<div id="toolbar">
<button id="save-vm-state" type="button">Save VM state</button>
<button id="clear-vm-state" type="button">Delete saved state</button>
<button id="run-network-test" type="button">Run network test</button>
<button id="run-bootstrap" type="button">Wake shell / run bootstrap</button>
<button id="copy-results" type="button">Copy test results</button>
<button id="paste-terminal" type="button">Paste into VM</button>
<button id="clear-results" type="button">Clear results</button>
<span id="copy-status"></span>
<span id="state-status" aria-live="polite">Saved state: checkingâ¦</span>
</div>
<textarea id="results" spellcheck="false" placeholder="Full startup/network report. It is saved locally so you can copy it in sections."></textarea>
<pre id="myst-log">Waiting for Tiny Core...</pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="/v86/libv86.js"></script>
<script>
window.onload=function(){
const status=document.getElementById('status'),results=document.getElementById('results'),mystLog=document.getElementById('myst-log'),copyStatus=document.getElementById('copy-status'),stateStatus=document.getElementById('state-status');
const nodeId='7cbee0e9-da6b-4808-92a7-4a3c2a45a840',apiUrl=window.location.origin;
let reportTimer=null,bootstrapStarted=false,bootComplete=false;

function statusText(t){status.textContent=t}
const SNAPSHOT_DB='tinycore-v86-snapshots',SNAPSHOT_STORE='snapshots',SNAPSHOT_KEY='tinycore-main-v1';
let snapshotDb=null,snapshotReady=false,snapshotBusy=false,vmLoaded=false,restoredSnapshot=false,autosaveTimer=null;
function stateText(t){stateStatus.textContent=t}
function openSnapshotDb(){
return new Promise((resolve,reject)=>{
const request=indexedDB.open(SNAPSHOT_DB,1);
request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(SNAPSHOT_STORE))db.createObjectStore(SNAPSHOT_STORE)};
request.onsuccess=()=>{snapshotDb=request.result;resolve(snapshotDb)};
request.onerror=()=>reject(request.error||new Error('Could not open browser storage'));
});
}
function snapshotTransaction(mode,action,value){
return new Promise((resolve,reject)=>{
const tx=snapshotDb.transaction(SNAPSHOT_STORE,mode),store=tx.objectStore(SNAPSHOT_STORE);
let req;
if(action==='get')req=store.get(SNAPSHOT_KEY);
else if(action==='put')req=store.put(value,SNAPSHOT_KEY);
else req=store.delete(SNAPSHOT_KEY);
tx.oncomplete=()=>resolve(req?req.result:undefined);
tx.onerror=()=>reject(tx.error||new Error('Browser storage operation failed'));
tx.onabort=()=>reject(tx.error||new Error('Browser storage operation was aborted'));
});
}
async function saveVmState(manual=true){
if(snapshotBusy){if(manual)stateText('A save is already in progress.');return}
if(!vmLoaded||!window.emulator||typeof window.emulator.save_state!=='function'){if(manual)stateText('VM is not ready to save yet.');return}
snapshotBusy=true;
if(manual)stateText('Saving VM memory and CPU stateâ¦');
try{
const state=await window.emulator.save_state();
await snapshotTransaction('readwrite','put',{state,savedAt:Date.now(),version:1});
stateText('Saved locally at '+new Date().toLocaleTimeString());
}catch(e){
stateText('Save failed: '+(e&&e.message?e.message:'browser storage unavailable'));
report('\n*** VM STATE SAVE FAILED: '+(e&&e.message?e.message:String(e))+' ***\n');
}finally{snapshotBusy=false}
}
async function loadVmState(){
try{await openSnapshotDb();snapshotReady=true;const record=await snapshotTransaction('readonly','get');return record&&record.version===1?record:null}
catch(e){snapshotReady=false;stateText('Saved state unavailable; browser storage may be blocked.');return null}
}
document.getElementById('save-vm-state').onclick=()=>saveVmState(true);
document.getElementById('clear-vm-state').onclick=async()=>{
if(!snapshotReady){stateText('Saved-state storage is not ready.');return}
if(!confirm('Delete the saved VM state from this browser? This cannot be undone.'))return;
try{await snapshotTransaction('readwrite','delete');stateText('Saved VM state deleted. The current VM keeps running.')}
catch(e){stateText('Could not delete saved state.')}
};
function save(){try{localStorage.setItem('mysterium-network-test-results',results.value)}catch(e){}}
function report(t){results.value+=t;results.scrollTop=results.scrollHeight;save()}
try{const s=localStorage.getItem('mysterium-network-test-results');if(s)results.value=s}catch(e){}

document.getElementById('clear-results').onclick=function(){results.value='';save()};
document.getElementById('copy-results').onclick=async function(){
try{await navigator.clipboard.writeText(results.value)}catch(e){results.focus();results.select();document.execCommand('copy')}
copyStatus.textContent='Results copied.';requestAnimationFrame(()=>copyStatus.textContent='',1800)
};
async function pasteIntoVm(){
try{
const text=await navigator.clipboard.readText();if(!text)throw new Error('empty');
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')throw new Error('VM not ready');
window.emulator.keyboard_send_text(text);if(!/[\r\n]$/.test(text))window.emulator.keyboard_send_text('\n');
copyStatus.textContent='Pasted and executed.'
}catch(e){copyStatus.textContent='Paste blocked; use the button again.'}
requestAnimationFrame(()=>copyStatus.textContent='',3000)
}
document.getElementById('paste-terminal').onclick=pasteIntoVm;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='v'){e.preventDefault();pasteIntoVm()}});

function shellPrompt(text){
const normalized=String(text||'').replace(/\r/g,'').replace(/\u00a0/g,' ');
const lines=normalized.split('\n').map(line=>line.trim()).filter(Boolean);
const promptPattern=/^tc@box(?::[^\n]{0,80})?\s*[$#]\s*$/;
const lastLine=lines.length?lines[lines.length-1]:'';
return promptPattern.test(lastLine)?lastLine:'';
}
function screenText(){
if(window.emulator&&window.emulator.screen_adapter&&typeof window.emulator.screen_adapter.get_text_screen==='function'){
return window.emulator.screen_adapter.get_text_screen().join('\n');
}
const s=document.querySelector('#screen_container > div');
return(s&&s.textContent)||'';
}
function mirror(){
const t=screenText().trim();
if(t){mystLog.textContent=t;mystLog.scrollTop=mystLog.scrollHeight}
}
function mirrorLoop(){mirror();requestAnimationFrame(mirrorLoop)}
requestAnimationFrame(mirrorLoop);

const diagnosticCommand=`wget -q -O /tmp/network-test.sh ${apiUrl}/runner/tinycore/network-test.sh; dl=$?; echo NETWORK_TEST_DOWNLOAD_RC=$dl; if [ "$dl" -eq 0 ]; then sh /tmp/network-test.sh; else echo NETWORK_TEST_DOWNLOAD_FAILED; fi`;

function runDiagnostic(label){
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')return;
report('\n\n===== '+label+' =====\n'+diagnosticCommand+'\n');
window.emulator.keyboard_send_text(diagnosticCommand+'\n');
requestAnimationFrame(function(){
report('----- screen snapshot -----\n'+screenText()+'\n----- end snapshot -----\n')
},9000)
}
document.getElementById('run-network-test').onclick=function(){runDiagnostic('MANUAL NETWORK TEST');statusText('Network test requested; results are being captured.')};
document.getElementById('run-bootstrap').onclick=async function(){
if(!window.emulator||!vmLoaded){statusText('VM is not ready yet. Wait for the VM engine to load.');report('\n*** MANUAL START: VM is not ready. ***\n');return}
if(bootstrapStarted){statusText('Bootstrap has already started in this page session; check the report.');return}
try{
if(typeof window.emulator.keyboard_send_text!=='function')throw new Error('v86 keyboard_send_text API is unavailable');
if(typeof window.emulator.keyboard_set_enabled==='function')window.emulator.keyboard_set_enabled(true);
statusText('Sending explicit Enter and shell test command; waiting for a stable prompt.');
report('\n===== MANUAL SHELL WAKE =====\nSending Enter, then echo __MANUAL_BOOTSTRAP_WAKE__.\n');
await sendVmCommand('\n');
await sendVmCommand('echo __MANUAL_BOOTSTRAP_WAKE__\n');
report('Keyboard API accepted the shell wake sequence.\n');
startBootMonitor();
}catch(e){
report('\n*** MANUAL SHELL WAKE FAILED: '+(e&&e.message?e.message:String(e))+' ***\n');
statusText('Keyboard input failed: '+(e&&e.message?e.message:String(e)));
}
};

async function sendVmCommand(cmd){
if(!window.emulator||typeof window.emulator.keyboard_send_text!=='function')throw new Error('v86 keyboard API unavailable');
if(typeof window.emulator.keyboard_set_enabled==='function')window.emulator.keyboard_set_enabled(true);
await window.emulator.keyboard_send_text(cmd,2);
await new Promise(r=>requestAnimationFrame(r,250));
}

async function startBootstrap(){
if(bootstrapStarted)return;bootstrapStarted=true;statusText('Tiny Core ready; running sequential network/TLS preflight. Mysterium is disabled.');
const commands=[
`echo "--- NETWORK INIT ---"; id; sudo -n sh -c 'set +e; /sbin/ifconfig eth0 up; /sbin/udhcpc -f -n -q -i eth0; rc=$?; echo DHCP_RC=$rc; /sbin/ifconfig eth0; /sbin/route -n; if [ "$rc" -eq 0 ] && /sbin/ifconfig eth0 | grep -Eq "inet (addr:)?([0-9]{1,3}[.]){3}[0-9]{1,3}" && /sbin/route -n | grep -Eq "^0[.]0[.]0[.]0[[:space:]]+[1-9][0-9]*[.]"; then echo DHCP_OK; else echo DHCP_FAIL; fi'; echo DHCP_''DONE`,
'echo "--- RESOURCE PREFLIGHT ---"; df -h / /tmp /usr/local/tce 2>&1; free 2>&1; cat /proc/meminfo 2>/dev/null | head -n 8; echo "TLS prerequisite installation will run before HTTPS preflight."; printf "\n__RESOURCE_""PREFLIGHT_DONE\n"',
'echo "--- TLS package downloads ---"; tce-load -w openssl-1.1.1.tcz; openssl_dl=$?; tce-load -w ca-certificates.tcz; ca_dl=$?; echo OPENSSL_DOWNLOAD_RC=$openssl_dl; echo CA_DOWNLOAD_RC=$ca_dl; printf "\n__TLS_DOWNLOAD_""DONE:%s:%s\n" "$openssl_dl" "$ca_dl"',
'echo "--- OpenSSL install ---"; tce-load -i openssl-1.1.1 >/tmp/openssl-install.log 2>&1 & op=$!; while ! openssl version >/dev/null 2>&1 && kill -0 "$op" 2>/dev/null; do sleep 1; done; openssl version >/dev/null 2>&1; rc=$?; echo OPENSSL_PATH=$(command -v openssl 2>/dev/null); echo OPENSSL_INSTALL_RC=$rc; printf "\n__OPENSSL_INSTALL_""DONE:%s\n" "$rc"',
"echo \"--- CA certificate install (background; wait for completion) ---\"; find /usr/local/etc/ssl/certs /usr/local/share/ca-certificates /etc/ssl/certs -type f 2>/dev/null | sort > /tmp/ca-files-before.txt; tce-load -i ca-certificates >/tmp/ca-certificates-install.log 2>&1 & cp=$!; while kill -0 \"$cp\" 2>/dev/null; do sleep 1; done; wait \"$cp\"; ca_ir=$?; echo CA_INSTALL_RC=$ca_ir; tail -n 12 /tmp/ca-certificates-install.log; find /usr/local/etc/ssl/certs /usr/local/share/ca-certificates /etc/ssl/certs -type f 2>/dev/null | sort > /tmp/ca-files-after.txt; echo \"--- Newly installed CA files ---\"; new_count=0; while IFS= read -r f; do if ! grep -F -x -q \"$f\" /tmp/ca-files-before.txt; then echo \"CA_INSTALLED_FILE=$f\"; new_count=$((new_count+1)); fi; done < /tmp/ca-files-after.txt; echo CA_INSTALLED_FILE_COUNT=$new_count; CA_BUNDLE=; for f in /usr/local/etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt /usr/local/share/ca-certificates/cacert.pem /etc/ssl/cert.pem; do if [ -s \"$f\" ]; then CA_BUNDLE=\"$f\"; break; fi; done; if [ -z \"$CA_BUNDLE\" ] && [ -d /usr/local/etc/ssl/certs ]; then set -- /usr/local/etc/ssl/certs/*.pem; if [ -f \"$1\" ]; then cat \"$@\" >/tmp/ca-certificates-bundle.pem 2>/dev/null && [ -s /tmp/ca-certificates-bundle.pem ] && CA_BUNDLE=/tmp/ca-certificates-bundle.pem; fi; fi; if [ -z \"$CA_BUNDLE\" ] && [ -d /usr/local/share/ca-certificates/mozilla ]; then set -- /usr/local/share/ca-certificates/mozilla/*.crt; if [ -f \"$1\" ]; then cat \"$@\" >/tmp/ca-certificates-bundle.pem 2>/dev/null && [ -s /tmp/ca-certificates-bundle.pem ] && CA_BUNDLE=/tmp/ca-certificates-bundle.pem; fi; fi; if [ -z \"$CA_BUNDLE\" ] && [ -d /usr/local/share/ca-certificates ]; then set -- /usr/local/share/ca-certificates/*.crt; if [ -f \"$1\" ]; then cat \"$@\" >/tmp/ca-certificates-bundle.pem 2>/dev/null && [ -s /tmp/ca-certificates-bundle.pem ] && CA_BUNDLE=/tmp/ca-certificates-bundle.pem; fi; fi; if [ \"$ca_ir\" -eq 0 ] && [ -s \"$CA_BUNDLE\" ]; then export SSL_CERT_FILE=\"$CA_BUNDLE\"; rc=0; else rc=1; fi; echo CA_BUNDLE_PATH=${CA_BUNDLE:-MISSING}; printf \"\\n__CA_CERTIFICATES_INSTALL_\"\"DONE:%s\\n\" \"$rc\""
`echo "--- DNS / HTTPS PREFLIGHT ---"; echo "DNS_CONFIG:"; cat /etc/resolv.conf 2>&1; rc=1; attempt=1; while [ "$attempt" -le 3 ]; do echo "HTTPS_PREFLIGHT_ATTEMPT=$attempt"; wget -S -O /dev/null ${apiUrl}/health 2>&1; rc=$?; echo HTTPS_ATTEMPT_RC=$rc; if [ "$rc" -eq 0 ]; then break; fi; attempt=$((attempt+1)); sleep 2; done; echo INTERNET_HTTPS_RC=$rc; if [ "$rc" -eq 0 ]; then echo INTERNET_HTTPS_OK; else echo INTERNET_HTTPS_FAIL; fi; printf "\\n__EGRESS_PREFLIGHT_%s:%s\\n" DONE "$rc"`,
\`wget -q -O /tmp/network-test.sh \${apiUrl}/runner/tinycore/network-test.sh; rc=$?; echo NETWORK_TEST_DOWNLOAD_RC=$rc; printf "\\n__NETWORK_DOWNLOAD_DONE:%s\\n" "$rc"\`,
'sh /tmp/network-test.sh; rc=$?; printf "\\n__NETWORK_TEST_DONE:%s\\n" "$rc"',
\`wget -q -O /tmp/fineproxy-test.sh \${apiUrl}/runner/tinycore/fineproxy-test.sh; rc=$?; echo FINEPROXY_TEST_DOWNLOAD_RC=$rc; printf "\\n__FINEPROXY_DOWNLOAD_DONE:%s\\n" "$rc"\`,
'sh /tmp/fineproxy-test.sh; rc=$?; printf "\\n__FINEPROXY_TEST_DONE:%s\\n" "$rc'
];
const markers=['DHCP_DONE','__RESOURCE_PREFLIGHT_DONE','__TLS_DOWNLOAD_DONE:','__OPENSSL_INSTALL_DONE:','__CA_CERTIFICATES_INSTALL_DONE:','__EGRESS_PREFLIGHT_DONE:','__NETWORK_DOWNLOAD_DONE:','__NETWORK_TEST_DONE:','__FINEPROXY_DOWNLOAD_DONE:','__FINEPROXY_TEST_DONE:'];
// No per-step timeout; wait for completion markers.
let i=0;
function terminal(){return screenText()}
function markerCount(text,marker){return String(text||'').split(marker).length-1}
function markerResult(text,marker){const at=String(text||'').lastIndexOf(marker);return at<0?'':String(text).slice(at+marker.length).split(/\r?\n/,1)[0].trim()}
async function next(){
if(i>=commands.length){
statusText('Startup preflight and network tests complete. Mysterium remains disabled.');
report('\n===== STARTUP COMPLETE — MYSTERIUM DISABLED =====\n');
while(snapshotBusy)await new Promise(r=>requestAnimationFrame(r));
const saved=await saveVmState(false);
statusText(saved?'Startup and network tests complete; VM state saved.':'Startup complete; VM state save did not complete. Check saved-state status.');
return;
}
const n=i++,cmd=commands[n],marker=markers[n];
report('\n===== BOOTSTRAP STEP '+(n+1)+'/'+commands.length+' =====\n'+cmd+'\n');
const markerCountBefore=marker?markerCount(terminal(),marker):0;
await sendVmCommand(cmd+'\n');
if(marker){
const started=Date.now();
(function wait(){
const t=terminal(),markerAt=t.lastIndexOf(marker);
if(markerCount(t,marker)>markerCountBefore&&shellPrompt(t.slice(markerAt+marker.length))){
report('----- bootstrap screen snapshot -----\n'+terminal()+'\n----- end bootstrap screen snapshot -----\n');
if(marker==='DHCP_DONE'&&!terminal().includes('DHCP_OK')){report('*** DHCP did not install a usable IPv4 address and default route. No guessed gateway will be added; stopping before package/bootstrap downloads. ***\\n');statusText('DHCP/default-route check failed; diagnostics captured.');return} if(marker==='__OPENSSL_INSTALL_DONE:'&&markerResult(t,marker)!=='0'){report('*** OpenSSL install did not produce a working binary; stopping before HTTPS. See /tmp/openssl-install.log. ***\\n');statusText('OpenSSL install failed; diagnostics captured.');return} if(marker==='__CA_CERTIFICATES_INSTALL_DONE:'&&markerResult(t,marker)!=='0'){report('*** CA certificate file is missing; stopping before HTTPS. See /tmp/ca-certificates-install.log. ***\\n');statusText('CA install failed; diagnostics captured.');return} if(marker==='__EGRESS_PREFLIGHT_DONE:'&&!terminal().includes('__EGRESS_PREFLIGHT_DONE:0')){report('*** HTTPS check against the deployed Worker failed after OpenSSL and CA certificates were installed and verified. Stopping before bootstrap download. ***\\n');statusText('Internet HTTPS check failed; diagnostics captured.');return}

next();return
}
requestAnimationFrame(wait,500)
})()
}else requestAnimationFrame(next,250)
}
next()
}

results.value='';save();report('\n===== VM RUN STARTED =====\n');
statusText('Loading v86â¦');
try{
window.emulator=new V86({
wasm_path:'/v86/v86.wasm',memory_size:128*1024*1024,vga_memory_size:8*1024*1024,
screen_container:document.getElementById('screen_container'),
bios:{url:'/bios/seabios.bin'},vga_bios:{url:'/bios/vgabios.bin'},
cdrom:{url:'/boot/TinyCorePure64-11.0-v86-ne2k-dhcp-experimental.iso'},
net_device:{type:'ne2k',relay_url:'wss://relay.widgetry.org/'},
network_relay_url:'wss://relay.widgetry.org/',autostart:false
});
statusText('Loading VM engine and checking for a saved stateâ¦');
window.emulator.add_listener('emulator-loaded',async function(){
if(vmLoaded)return;
vmLoaded=true;
const record=await loadVmState();
if(record&&record.state){
try{
stateText('Restoring saved VM stateâ¦');
await window.emulator.restore_state(record.state);
restoredSnapshot=true;
stateText('Restored saved state from '+new Date(record.savedAt).toLocaleString());
await window.emulator.run();
}catch(e){
restoredSnapshot=false;
stateText('Saved state could not be restored; starting a clean VM.');
report('\n*** RESTORE FAILED: '+(e&&e.message?e.message:String(e))+' ***\n');
await window.emulator.run();
}
}else{
stateText('No saved VM state found; starting a clean VM.');
await window.emulator.run();
}
if(!restoredSnapshot)startBootMonitor();
else statusText('Saved VM resumed. Network services may need reconnecting.');
autosaveTimer=setInterval(()=>saveVmState(false),5*60*1000);
});
let promptCandidate='',promptCandidateSince=0;
const PROMPT_STABLE_MS=2000;
function shellPrompt(text){
const normalized=String(text||'').replace(/\r/g,'').replace(/\u00a0/g,' ');
const lines=normalized.split('\n').map(line=>line.trim()).filter(Boolean);
const promptPattern=/^tc@box(?::[^\n]{0,80})?\s*[$#]\s*$/;
for(let i=lines.length-1;i>=Math.max(0,lines.length-6);i--){
if(promptPattern.test(lines[i]))return lines[i];
}
return '';
}
function startBootMonitor(){
statusText('Tiny Core is booting; waiting for a stable shell prompt before sending commands.');
(function waitForBootComplete(){
const t=screenText();
const prompt=shellPrompt(t);
if(prompt){
if(prompt===promptCandidate){
if(Date.now()-promptCandidateSince>=PROMPT_STABLE_MS){
statusText('Tiny Core shell prompt is stable; starting bootstrap.');
startBootstrap();
return;
}
}else{promptCandidate=prompt;promptCandidateSince=Date.now();}
}else{promptCandidate='';promptCandidateSince=0;}
requestAnimationFrame(waitForBootComplete,500);
})();
}
}catch(e){statusText('VM ERROR: '+e.message)}
};
</script>
</body>
</html>
