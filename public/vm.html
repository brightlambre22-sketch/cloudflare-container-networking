<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mysterium Browser VM</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: monospace; }
  #status { padding: 8px; }
  #toolbar { padding: 8px; background: #181818; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 6px 10px; cursor: pointer; }
  #copy-status { color: #8f8; }
  #myst-log { margin: 0; padding: 8px; height: 220px; overflow: auto; white-space: pre-wrap; user-select: text; background: #000; color: #ddd; border-top: 1px solid #333; }
  #screen_container { width: 100%; min-height: 480px; }
</style>
</head>
<body>
<div id="status">Starting Linux VM...</div>
<div id="toolbar">
  <button id="copy-errors" type="button">Copy terminal text</button>
  <span id="copy-status"></span>
</div>
<pre id="myst-log">Waiting for Tiny Core...</pre>
<div id="screen_container"><div></div><canvas></canvas></div>
<script src="/v86/libv86.js"></script>
<script>
window.onload=function(){
  const status=document.getElementById('status');
  const nodeId='7cbee0e9-da6b-4808-92a7-4a3c2a45a840';
  const apiUrl=window.location.origin;
  const mystLog=document.getElementById('myst-log');
  const copyStatus=document.getElementById('copy-status');
  document.getElementById('copy-errors').addEventListener('click',async function(){
    const text=(mystLog.textContent || '').trim();
    try {
      await navigator.clipboard.writeText(text);
      copyStatus.textContent='Copied.';
      setTimeout(function(){ copyStatus.textContent=''; },1500);
    } catch(e) {
      const area=document.createElement('textarea');
      area.value=text;
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      copyStatus.textContent='Copied.';
      setTimeout(function(){ copyStatus.textContent=''; },1500);
    }
  });
  function mirrorTerminal(){
    const screen=document.querySelector('#screen_container > div');
    const text=(screen && screen.textContent || '').trim();
    if(text) {
      mystLog.textContent=text;
      mystLog.scrollTop=mystLog.scrollHeight;
    }
  }
  const bootstrapB64='IyEvYmluL3NoCnNldCAtZXUKQVBJX1VSTD0iX19BUElfVVJMX18iCk5PREVfSUQ9IjdjYmVlMGU5LWRhNmItNDgwOC05MmE3LTRhM2MyYTQ1YTg0MCIKCmlmIGNvbW1hbmQgLXYgdWRoY3BjID4vZGV2L251bGwgMj4mMTsgdGhlbgogIGlwIGxpbmsgc2V0IGV0aDAgdXAgMj4vZGV2L251bGwgfHwgdHJ1ZQogIHVkaGNwYyAtbiAtcSAtaSBldGgwIDI+L2Rldi9udWxsIHx8IHRydWUKZmkKCmlmICEgY29tbWFuZCAtdiB3Z2V0ID4vZGV2L251bGwgMj4mMTsgdGhlbgogIGVjaG8gIndnZXQgdW5hdmFpbGFibGUiCiAgZXhpdCAxCmZpCgplY2hvICJbY2xvdWRmbGFyZV0gcmVxdWVzdGluZyBleHRlcm5hbCBydW50aW1lIHN0YXJ0Igp3Z2V0IC1xIC1PIC90bXAvcnVudGltZS1zdGFydC5qc29uIC0tcG9zdC1kYXRhPScnICIkQVBJX1VSTC92MS9ub2Rlcy8kTk9ERV9JRC9ydW50aW1lL3N0YXJ0IiB8fCB0cnVlCgplY2hvICJbY2xvdWRmbGFyZV0gbW9uaXRvcmluZyBleHRlcm5hbCBydW50aW1lIgppPTAKd2hpbGUgWyAiJGkiIC1sdCAzMCBdOyBkbwogIGlmIHdnZXQgLXEgLU8gL3RtcC9ydW50aW1lLXByb2JlLmpzb24gIiRBUElfVVJML3YxL25vZGVzLyROT0RFX0lEL3J1bnRpbWUvcHJvYmUiOyB0aGVuCiAgICBjYXQgL3RtcC9ydW50aW1lLXByb2JlLmpzb24KICBmaQogIHNsZWVwIDIKICBpPSQoKGkgKyAxKSkKZG9uZQoKZWNobyAiQ0xPVURGTEFSRV9CUk9XU0VSX0JPT1RTVFJBUF9DT01QTEVURSIK';

  function startBrowserBootstrap(){
    if (window.__browserBootstrapStarted) return;
    window.__browserBootstrapStarted=true;
    status.textContent='Tiny Core ready; configuring network and starting node...';

    // Run one sequential shell script. Do not use fixed timers: package
    // loading and HTTPS bootstrap can take longer than expected.
    const script=[
      'set -e',
      'sudo -n ip link set eth0 up',
      'sudo -n udhcpc -n -q -i eth0',
      'tce-load -wil openssl-1.1.1.tcz ca-certificates.tcz',
      'wget -q -O /tmp/cloudflare-browser-bootstrap.sh https://raw.githubusercontent.com/brightlambre22-sketch/cloudflare-container-networking/main/runner/tinycore/browser-bootstrap.sh',
      'sh /tmp/cloudflare-browser-bootstrap.sh '+apiUrl+' '+nodeId,
      'test -x /opt/cloudflare-node/myst-supervisor.sh',
      'test -x /opt/cloudflare-node/cloudflare-runner.sh',
      'nohup /opt/cloudflare-node/myst-supervisor.sh >/var/log/myst-supervisor-console.log 2>&1 &',
      'nohup /opt/cloudflare-node/cloudflare-runner.sh >/var/log/cloudflare-runner-console.log 2>&1 &',
      'sleep 2',
      'clear',
      'echo "Mysterium live console"',
      'tail -F /var/log/mysterium-node.log /var/log/myst-supervisor-console.log /var/log/cloudflare-runner-console.log 2>/dev/null'
    ].join('; ');
    window.emulator.keyboard_send_text(script+'\n');
  }

  status.textContent='Loading v86...';
  try {
    window.emulator=new V86({
      wasm_path:'/v86/v86.wasm',
      memory_size:128*1024*1024,
      vga_memory_size:8*1024*1024,
      screen_container:document.getElementById('screen_container'),
      bios:{url:'/bios/seabios.bin'},
      vga_bios:{url:'/bios/vgabios.bin'},
      cdrom:{url:'/boot/TinyCore-11.0.iso'},
      // Give Tiny Core a real emulated NIC. The relay provides the browser-side
      // bridge to the outside network so wget/DNS can reach the bootstrap.
      // Current v86 API:
      net_device:{type:'ne2k',relay_url:'wss://relay.widgetry.org/'},
      // Keep the legacy option for the bundled v86 build if it predates
      // net_device.
      network_relay_url:'wss://relay.widgetry.org/',
      autostart:true
    });
    status.textContent='Linux VM starting with network...';
    let commandLineModeStarted=false;
    function sendCommandLineBoot(){
      if(commandLineModeStarted) return;
      commandLineModeStarted=true;
      // TinyCore 11's CD menu places "Core (command line only)" after the
      // graphical TinyCore entries. Select it automatically.
      setTimeout(function(){
        try {
          if(window.emulator && typeof window.emulator.keyboard_send_scancodes==='function'){
            window.emulator.keyboard_send_scancodes([0x50,0x50,0x1c]);
          } else if(window.emulator && typeof window.emulator.keyboard_send_keys==='function'){
            window.emulator.keyboard_send_keys(['ARROWDOWN','ARROWDOWN','ENTER']);
          }
        } catch(e) {
          console.error(e);
        }
      },1500);
    }

    function tinyCorePromptVisible(){
      const textScreen=document.querySelector('#screen_container > div');
      const text=(textScreen && textScreen.textContent) || '';
      return /tc@box|tc@/.test(text);
    }

    function waitForTinyCorePrompt(timeoutMs){
      return new Promise(function(resolve,reject){
        const started=Date.now();
        function check(){
          if(tinyCorePromptVisible()){
            resolve(true);
            return;
          }
          if(Date.now()-started >= timeoutMs){
            reject(new Error('Tiny Core prompt not detected within '+Math.round(timeoutMs/1000)+' seconds'));
            return;
          }
          setTimeout(check,500);
        }
        check();
      });
    }

    // Try the boot-menu selection automatically; if the ISO is already past
    // the menu, these keystrokes are harmless.
    sendCommandLineBoot();

    setInterval(mirrorTerminal,500);

    waitForTinyCorePrompt(120000)
      .then(function(){ startBrowserBootstrap(); })
      .catch(function(error){
        console.error(error);
        status.textContent='VM bootstrap wait failed: '+error.message;
      });
  } catch(e) {
    console.error(e);
    status.textContent='VM ERROR: '+e.message;
  }
};
</script>
</body>
</html>
