<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · VM Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--border:#28364c;--text:#e7edf7;--muted:#9aa9bf;--accent:#6ee7b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
main{width:min(430px,100%);padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:16px}
h1{margin:0 0 8px;font-size:24px}.muted{color:var(--muted);line-height:1.5;font-size:14px}
label{display:block;margin:18px 0 8px}input{width:100%;padding:12px;border:1px solid #40506a;border-radius:8px;background:#0b1020;color:var(--text);font:inherit}
button{width:100%;margin-top:16px;padding:12px;border:1px solid #27896f;border-radius:8px;background:#17634f;color:white;font:inherit;cursor:pointer}
.switch{background:transparent;border-color:#40506a;color:var(--text);margin-top:10px}#error{min-height:24px;margin-top:12px;color:#fca5a5;font-size:14px}
</style></head>
<body><main>
<h1 id="heading">Sign in</h1>
<p class="muted" id="intro">Sign in to open the protected VM dashboard.</p>
<form id="auth-form">
<label for="username">Username</label>
<input id="username" name="username" type="text" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" autocomplete="username" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="current-password" required>
<button id="submit" type="submit">Sign in</button>
<div id="error" role="status" aria-live="polite"></div>
</form>
<button class="switch" id="switch" type="button">Create an account</button>
<button class="switch" id="admin-switch" type="button">Use administrator access key</button>
<p class="muted">Passwords must be at least 12 characters. Email verification will be added later.</p>
</main>
<script>
const form=document.getElementById('auth-form'),username=document.getElementById('username'),password=document.getElementById('password'),error=document.getElementById('error');
const heading=document.getElementById('heading'),intro=document.getElementById('intro'),submit=document.getElementById('submit'),switchButton=document.getElementById('switch'),adminSwitch=document.getElementById('admin-switch'),usernameLabel=document.querySelector('label[for="username"]'),passwordLabel=document.querySelector('label[for="password"]');
let mode='login';
function render(){const registering=mode==='register',admin=mode==='admin';heading.textContent=registering?'Create account':admin?'Administrator access':'Sign in';intro.textContent=registering?'Create a username and password to access the VM dashboard.':admin?'Enter the DASHBOARD_ACCESS_KEY configured in Cloudflare.':'Sign in to open the protected VM dashboard.';usernameLabel.hidden=admin;username.hidden=admin;username.required=!admin;username.disabled=admin;passwordLabel.textContent=admin?'Administrator access key':'Password';password.autocomplete=registering?'new-password':admin?'off':'current-password';password.minLength=admin?1:12;submit.textContent=registering?'Create account':admin?'Unlock dashboard':'Sign in';switchButton.textContent=registering?'Already have an account? Sign in':'Create an account';adminSwitch.textContent=admin?'Back to username login':'Use administrator access key';error.textContent='';}
switchButton.addEventListener('click',()=>{mode=mode==='login'?'register':'login';render();});
adminSwitch.addEventListener('click',()=>{mode=mode==='admin'?'login':'admin';render();});
form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';submit.disabled=true;
try{const endpoint=mode==='admin'?'/api/auth/admin-key':'/api/auth/'+mode;const payload=mode==='admin'?{key:password.value}:{username:username.value,password:password.value};const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to sign in. Please try again.');window.location.replace(data.redirect||'/dashboard.html');}
catch(e){error.textContent=e instanceof Error?(e.message||'Request failed. Please try again.'):'Request failed. Please try again.';}finally{submit.disabled=false;}
});
</script></body></html>
