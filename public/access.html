<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Access</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--border:#28364c;--text:#e7edf7;--muted:#9aa9bf;--accent:#6ee7b7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
main{width:min(420px,100%);padding:28px;background:var(--panel);border:1px solid var(--border);border-radius:16px}
h1{margin:0 0 8px;font-size:24px}.muted{color:var(--muted);line-height:1.5;font-size:14px}
label{display:block;margin:24px 0 8px}input{width:100%;padding:12px;border:1px solid #40506a;border-radius:8px;background:#0b1020;color:var(--text);font:inherit}
button{width:100%;margin-top:14px;padding:12px;border:1px solid #27896f;border-radius:8px;background:#17634f;color:white;font:inherit;cursor:pointer}
#error{min-height:24px;margin-top:12px;color:#fca5a5;font-size:14px}
</style></head>
<body><main>
<h1>VM Dashboard</h1>
<p class="muted">Enter your temporary 5-digit dashboard code.</p>
<form id="login">
<label for="key">5-digit access code</label>
<input id="key" name="key" type="password" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" autocomplete="one-time-code" placeholder="•••••" required autofocus>
<button type="submit">Unlock dashboard</button>
<div id="error" role="status" aria-live="polite"></div>
</form>
</main>
<script>
const form=document.getElementById('login'),key=document.getElementById('key'),error=document.getElementById('error');
form.addEventListener('submit',async event=>{
event.preventDefault();error.textContent='';
try{
const response=await fetch('/api/dashboard-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:key.value})});
const data=await response.json();
if(!response.ok)throw new Error(data.error==='dashboard_auth_not_configured'?'Dashboard access has not been configured yet.':data.error==='invalid_access_key'?'That access key is not correct.':'Could not unlock dashboard.');
window.location.replace(data.redirect||'/dashboard.html');
}catch(e){error.textContent=e.message||'Could not connect. Please try again.'}
});
</script></body></html>
